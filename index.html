<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Curso NR-35 12h</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: barra de progresso em horas no topo, agenda dos 3 dias na lateral, módulo de 1 h no centro.
   Cores: sinalização de segurança (amarelo de EPI sobre azul-petróleo). */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#13202B; --muted:#546472; --line:#D2D9DF;
  --navy:#0F2A3F; --navy-ink:#EAF1F6; --accent:#F2B705; --accent-ink:#1A1400;
  --ok:#1E7A4B; --ok-bg:#E2F3EA; --bad:#B62E1B; --bad-bg:#FBE7E3; --info:#1F5F8B; --info-bg:#E3EEF6;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C141B; --surface:#152029; --ink:#E6ECF1; --muted:#93A2AF; --line:#2A3947;
  --navy:#0A1B29; --navy-ink:#EAF1F6; --accent:#F5C518; --accent-ink:#1A1400;
  --ok:#5CC98D; --ok-bg:#12301F; --bad:#FF8F7D; --bad-bg:#3A1A15; --info:#7DB8E4; --info-bg:#15293A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C141B; --surface:#152029; --ink:#E6ECF1; --muted:#93A2AF; --line:#2A3947;
  --navy:#0A1B29; --navy-ink:#EAF1F6; --accent:#F5C518; --accent-ink:#1A1400;
  --ok:#5CC98D; --ok-bg:#12301F; --bad:#FF8F7D; --bad-bg:#3A1A15; --info:#7DB8E4; --info-bg:#15293A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{background:var(--navy);color:var(--navy-ink);padding:14px 16px 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,#111 10px 20px)}
.top-in{max-width:1180px;margin:0 auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand b{background:var(--accent);color:var(--accent-ink);padding:0 8px;margin-right:8px}
.prog{flex:1;min-width:180px;display:grid;gap:4px}
.prog small{font:500 .75rem var(--f-mono);letter-spacing:.04em;text-transform:uppercase;opacity:.85}
.bar{height:10px;background:rgba(255,255,255,.18);display:flex;gap:2px}
.bar i{flex:1;background:rgba(255,255,255,.12)} .bar i.on{background:var(--accent)}
.tog{background:transparent;border:1.5px solid var(--navy-ink);color:var(--navy-ink);padding:6px 12px;font:500 .8rem var(--f-mono);text-transform:uppercase;letter-spacing:.04em}
.tog[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:32px 64px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px}
.nav{position:sticky;top:96px;align-self:start;display:grid;gap:4px}
.nav h4{font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.nav button{display:flex;gap:10px;align-items:baseline;text-align:left;background:none;border:0;border-left:4px solid var(--line);padding:7px 10px;width:100%}
.nav button:hover{background:var(--surface)}
.nav button[aria-current="true"]{border-left-color:var(--accent);background:var(--surface);font-weight:600}
.nav .n{font:500 .8rem var(--f-mono);color:var(--muted)}
.nav .ck{margin-left:auto;color:var(--ok);font-weight:600}
.nav .home{border-left-color:var(--ink);font-weight:600}

main{min-width:0}
.mhead{display:grid;gap:8px;margin-bottom:24px}
.kick{font:500 .78rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mhead h1{font-size:clamp(2rem,5vw,3rem)}
.mhead p{margin:0;color:var(--muted);max-width:65ch}
.goals{background:var(--surface);border:1px solid var(--line);padding:14px 18px;margin-bottom:20px}
.goals h3{font-size:1.1rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.goals ul{margin:0;padding-left:20px} .goals li{margin:3px 0}
.block{background:var(--surface);border:1px solid var(--line);padding:20px;margin-bottom:20px;min-width:0}
.block>h3{font-size:1.5rem;margin-bottom:12px}
.block p{max-width:70ch} .block ul{max-width:70ch;padding-left:20px}
.tag{display:inline-block;font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:2px 8px;margin-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{border:1px solid var(--line);padding:14px;background:var(--bg)}
.card h4{font:700 1.15rem var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 4px}
.card p{margin:0;font-size:.95rem}
.card.warn{border-color:var(--bad);background:var(--bad-bg)}
.note{border-left:4px solid var(--info);background:var(--info-bg);padding:10px 14px;margin:12px 0;max-width:70ch}
.note.warn{border-color:var(--bad);background:var(--bad-bg)}

.q{padding:14px 0;border-top:1px solid var(--line)} .q:first-of-type{border-top:0;padding-top:0}
.qt{font-weight:600;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);padding:10px 14px;width:100%}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.sel{border-color:var(--info);background:var(--info-bg)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.two{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.fb{margin:10px 0 0;padding:8px 12px;font-size:.95rem;max-width:70ch}
.fb.ok{background:var(--ok-bg);border-left:4px solid var(--ok)} .fb.bad{background:var(--bad-bg);border-left:4px solid var(--bad)}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.crow:first-of-type{border-top:0}
.crow .btns{display:flex;gap:6px;flex-wrap:wrap}
.crow .btns .opt{width:auto;padding:6px 12px;font-size:.9rem}
.crow .fb{grid-column:1/-1;margin:0}
.ord{list-style:none;padding:0!important;margin:0;display:grid;gap:6px}
.ord li{display:flex;gap:8px;align-items:center;background:var(--bg);border:1.5px solid var(--line);padding:8px 10px}
.ord li span{flex:1;min-width:0}
.ord li.right{border-color:var(--ok);background:var(--ok-bg)} .ord li.wrong{border-color:var(--bad);background:var(--bad-bg)}
.mv{border:1px solid var(--line);background:var(--surface);width:32px;height:32px;line-height:1}
.act{background:var(--ink);color:var(--bg);border:0;padding:10px 18px;font:600 .9rem var(--f-mono);letter-spacing:.04em;text-transform:uppercase;margin-top:12px}
.act.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.flash{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.fc{min-height:120px;background:var(--navy);color:var(--navy-ink);border:0;padding:16px;text-align:left;font-size:1rem}
.fc small{display:block;font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.fc.back{background:var(--accent);color:var(--accent-ink)} .fc.back small{color:var(--accent-ink)}
.fc strong{font:700 1.3rem/1.15 var(--f-display)}

.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.calc label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.calc input[type=number]{font:500 1rem var(--f-mono);padding:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.calc input[type=range]{width:100%;accent-color:var(--accent)}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:16px}
.res div{border:1px solid var(--line);padding:12px;background:var(--bg)}
.res small{display:block;font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.res strong{font:700 2rem/1.1 var(--f-display)}
.gauge{margin-top:16px;display:grid;gap:8px}
.gauge .row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center;font-size:.85rem}
.gauge .trk{height:22px;background:var(--bg);border:1px solid var(--line)}
.gauge .fill{height:100%;background:var(--info);transition:width .2s}
.gauge .fill.need{background:var(--accent)} .gauge .fill.bad{background:var(--bad)}
.inst{border:2px dashed var(--info);background:var(--info-bg);padding:16px 18px;margin-bottom:20px}
.inst h3{font-size:1.2rem;text-transform:uppercase;letter-spacing:.04em;color:var(--info);margin-bottom:6px}
.inst ul{margin:0;padding-left:20px} .inst li{margin:4px 0}
.foot{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-top:3px solid var(--ink);padding-top:16px}
.foot .sc{font:500 .85rem var(--f-mono);color:var(--muted)}
.foot .row{display:flex;gap:8px;flex-wrap:wrap}
.done{background:var(--ok)!important;color:#fff!important}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.n{font-family:var(--f-mono)}
.id{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.id label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.id input{font:inherit;padding:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.result{padding:16px;border:2px solid var(--ink);margin-top:16px}
.result.pass{border-color:var(--ok);background:var(--ok-bg)} .result.fail{border-color:var(--bad);background:var(--bad-bg)}
.result strong{font:700 2.4rem/1 var(--f-display)}
.gab{margin:10px 0 0;padding:10px 12px;background:var(--bg);border-left:4px solid var(--muted);font-size:.92rem}
.mprog{margin-top:8px;display:grid;gap:6px;max-width:520px}
.mrow{display:flex;justify-content:space-between;gap:12px;font:500 .8rem var(--f-mono);text-transform:uppercase;letter-spacing:.04em}
.mrow.sm{color:var(--muted);text-transform:none;letter-spacing:0}
.bar2{height:16px;background:var(--line)} .bar2 i{display:block;height:100%;background:var(--ok);transition:width .3s}
.bar.cont{height:6px;display:block;background:rgba(255,255,255,.18)} .bar.cont i{display:block;height:100%;background:var(--accent);transition:width .3s}
.evalbox.locked{border:2px dashed var(--muted)}
.nav button:disabled{opacity:.5;cursor:not-allowed}
.nav .pc{margin-left:auto;font:500 .75rem var(--f-mono);color:var(--muted)} .nav .pc.ck{color:var(--ok);font-weight:600}
.rd{margin-top:14px} .act:disabled{opacity:.7;cursor:default}
.sync{font:500 .72rem var(--f-mono);letter-spacing:.04em;opacity:.85}
.chip{display:inline-block;font:500 .72rem var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border:1.5px solid var(--line)}
.chip.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)} .chip.fin{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mini{height:10px;background:var(--line)} .mini i{display:block;height:100%;background:var(--ok)}
.rowbtn{background:none;border:0;padding:0;text-align:left;font-weight:600;text-decoration:underline;font-size:1rem}
.reg{display:grid;gap:14px;max-width:560px} .reg label{display:grid;gap:4px;font-size:.9rem;color:var(--muted)}
.reg input[type=text],.reg input[type=email]{font:inherit;padding:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.err{color:var(--bad);font-size:.9rem;margin:0;min-height:1.2em}
pre.mail{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);padding:12px;font:400 .85rem/1.5 var(--f-mono);overflow:auto}
@media(max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:20px 48px}
  .nav{position:static;display:flex;overflow-x:auto;gap:6px;padding-bottom:6px}
  .nav h4{display:none}
  .nav button{border:1.5px solid var(--line);border-left-width:1.5px;width:auto;flex:none;padding:6px 10px;background:var(--surface)}
  .nav button[aria-current="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
  .nav .tt{display:none} .nav .home .tt{display:inline}
  .brand{font-size:1.25rem}
  .top{position:static}
  .crow{grid-template-columns:minmax(0,1fr)}
  .gauge .row{grid-template-columns:minmax(0,1fr)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <span id="sync" class="sync"></span>
  <button class="tog" id="instBtn" type="button" aria-pressed="false" hidden>Modo instrutor</button>

</div></header>

<script>
const $=s=>document.querySelector(s);
function h(tag,props,...kids){const e=document.createElement(tag);for(const k in props||{}){const v=props[k];if(v==null)continue;if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}kids.flat(9).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c))});return e}
const KEY='nr35-12h-v2';
let MODE='boot',UID=null,DB=null,USERC=null,MYREF=null,ISOWNER=false,ME=null;
function newState(){return{units:{},passed:{},score:{},attempts:{},stats:{},secs:{},current:null,finishedAt:null,summary:null,inst:false}}
let S=newState();
function loadLocal(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(newState(),JSON.parse(r))}catch(e){}}
function save(){if(MODE==='aluno')schedulePush();else if(MODE==='preview'||MODE==='local'){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}}
const sess={}; // pontuação da sessão por módulo
function rec(mod,ok,label){const s=sess[mod]=sess[mod]||{r:0,t:0};s.t++;if(ok)s.r++;const st=S.stats[mod]=S.stats[mod]||{r:0,t:0};st.t++;if(ok)st.r++;if(label)logResp(mod,label,ok);save();const el=document.getElementById('sc');if(el)el.textContent=scoreTxt(mod)}
function scoreTxt(mod){const s=sess[mod];return s?`Atividades deste módulo: ${s.r} de ${s.t} corretas`:'Faça as atividades para ver sua pontuação'}

/* ======================= CONTEÚDO ======================= */
const M=[
{id:'m1',day:1,title:'A norma e o conceito de altura',sub:'O que a NR-35 regula, a quem se aplica e a partir de que altura.',
 goals:['Definir trabalho em altura segundo a NR-35','Reconhecer o valor correto (2,00 m) e as armadilhas de prova','Identificar quando uma atividade do dia a dia entra no campo da norma'],
 exam:'Questões 1 e 3',
 inst:['0–10 min: abertura, apresentação dos participantes e regras do curso.','10–30 min: exposição do objetivo e do campo de aplicação (blocos abaixo).','30–50 min: atividade "É trabalho em altura?" em plenário: cada participante decide antes de o grupo discutir.','50–60 min: cartões de revisão e mini-prova.','Prática sugerida: caminhada pelo local de trabalho para achar 3 atividades acima de 2,00 m e 1 abaixo.'],
 blocks:[
 {t:'text',h:'O que a NR-35 estabelece',html:`<p>A NR-35 fixa os <strong>requisitos mínimos e as medidas de proteção</strong> para o trabalho em altura. Ela cobre o <strong>planejamento, a organização e a execução</strong> do serviço, para garantir a segurança e a saúde dos trabalhadores envolvidos <strong>direta ou indiretamente</strong> na atividade.</p><p>Considera-se trabalho em altura toda atividade executada <strong>acima de 2,00 m do nível inferior</strong>, onde haja <strong>risco de queda</strong>.</p><div class="note warn"><strong>Armadilha de prova:</strong> as alternativas 2,10 m, 2,50 m e 3 m são falsas. O número da NR-35 é 2,00 m.</div>`},
 {t:'cards',h:'Quatro ideias para guardar',items:[['Campo de aplicação','Toda atividade acima de 2,00 m do nível inferior com risco de queda.'],['Quem é protegido','Quem executa e também quem trabalha ao lado ou embaixo, direta ou indiretamente.'],['O que a norma organiza','Planejamento, organização e execução da atividade.'],['Abaixo de 2,00 m','A definição da NR-35 não se aplica, mas o risco segue precisando de avaliação (NR-1 e demais NRs).']]},
 {t:'quiz',h:'É trabalho em altura pela NR-35?',items:[
  {q:'Instalar uma antena de rádio no topo de uma torre a 18 m do solo.',o:['Sim','Não'],a:0,why:'18 m está acima de 2,00 m e há risco de queda.'},
  {q:'Trocar uma lâmpada usando escada, a 2,5 m do piso.',o:['Sim','Não'],a:0,why:'2,5 m é maior que 2,00 m. Escada não tira a atividade do campo da norma.'},
  {q:'Organizar caixas em uma prateleira usando um banquinho, a 1,2 m do piso.',o:['Sim','Não'],a:1,why:'Abaixo de 2,00 m a definição da NR-35 não é atingida.'},
  {q:'Trabalhar na borda de uma laje sem fechamento, 3 m acima do pavimento inferior.',o:['Sim','Não'],a:0,why:'Há risco de queda e a diferença de nível passa de 2,00 m.'},
  {q:'Subir em um poste para lançar cabo de fibra a 7 m de altura.',o:['Sim','Não'],a:0,why:'Poste é o caso clássico de telecomunicações. Soma-se o risco elétrico (NR-10) se houver rede próxima.'},
  {q:'Pintar uma fachada em cadeira suspensa a 15 m.',o:['Sim','Não'],a:0,why:'Acesso por cadeira suspensa também é trabalho em altura, com regras próprias de acesso por corda.'}]},
 {t:'flash',h:'Cartões de revisão',items:[['Altura na NR-35','Acima de 2,00 m do nível inferior, com risco de queda.'],['Envolvidos','Direta ou indiretamente com a atividade.'],['Alternativas de prova','2,10 m, 2,50 m e 3 m estão erradas.']]}
 ]},
{id:'m2',day:1,title:'Responsabilidades',sub:'O que cabe ao empregador e o que cabe ao trabalhador.',
 goals:['Separar as obrigações do empregador das do trabalhador','Saber o que fazer diante de risco grave e iminente','Entender a equipe de salvamento'],
 exam:'Questões 1, 5 e 6',
 inst:['0–15 min: exposição das duas listas de responsabilidades.','15–40 min: atividade de classificação, com discussão de cada item errado.','40–60 min: mini-prova e estudo de caso: "o trabalhador parou o serviço e o encarregado mandou voltar".','Ponto de atenção: o direito e o dever de interromper a atividade em risco grave e iminente.'],
 blocks:[
 {t:'cards',h:'Quem faz o quê',items:[['Empregador','Garantir o cumprimento da norma, elaborar a Análise de Risco, desenvolver procedimentos, capacitar e autorizar trabalhadores, garantir supervisão, organizar a resposta a emergências e assegurar a suspensão do trabalho em risco grave e iminente.'],['Trabalhador','Cumprir as disposições legais e os procedimentos, colaborar com o empregador, zelar pela sua segurança e a das outras pessoas e interromper a atividade diante de risco grave e iminente, comunicando o superior.']]},
 {t:'classify',h:'Classifique cada responsabilidade',buckets:['Empregador','Trabalhador'],items:[
  ['Desenvolver o procedimento operacional das atividades rotineiras',0,'O procedimento operacional é responsabilidade do empregador.'],
  ['Zelar pela própria segurança e pela de outras pessoas afetadas por suas ações ou omissões',1,'Dever do trabalhador.'],
  ['Interromper a atividade e informar o superior ao ver risco grave e iminente',1,'O trabalhador interrompe e comunica. O empregador, por sua vez, assegura a suspensão.'],
  ['Promover o programa de capacitação para trabalho em altura',0,'Capacitar é obrigação do empregador.'],
  ['Elaborar a Análise de Risco e a Permissão de Trabalho',0,'Planejamento é do empregador.'],
  ['Colaborar com o empregador no cumprimento da norma',1,'Colaboração e cumprimento dos procedimentos cabem ao trabalhador.'],
  ['Assegurar a organização de equipe para resposta a emergências',0,'A equipe de salvamento e emergência é organizada pelo empregador.'],
  ['Garantir que a atividade seja executada sob supervisão',0,'A forma de supervisão é definida na Análise de Risco, e o empregador a garante.']]},
 {t:'text',h:'Equipe de salvamento e emergência',html:`<p>O empregador deve assegurar que exista equipe capaz de responder a emergências. Essa equipe <strong>pode ser própria, formada por trabalhadores treinados, ou externa</strong>. Dizer que ela "deve ser necessariamente externa" é falso.</p>`},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'Quem deve desenvolver o procedimento operacional das atividades rotineiras de trabalho em altura?',o:['O trabalhador','O empregador','O fabricante do EPI','O sindicato'],a:1,why:'Procedimento operacional é dever do empregador.'},
  {q:'Um trabalhador percebe risco grave e iminente. O que ele deve fazer?',o:['Terminar a tarefa rapidamente','Interromper a atividade e informar o superior','Esperar a hora do almoço para avisar','Chamar um colega para assumir'],a:1,why:'Interromper e comunicar é dever do trabalhador.'},
  {q:'A equipe de salvamento pode ser composta por trabalhadores da própria empresa?',o:['Sim, desde que treinada e com recursos','Não, deve ser sempre externa'],a:0,why:'A norma permite equipe interna ou externa, desde que preparada.'}]}
 ]},
{id:'m3',day:1,title:'Capacitação, treinamento e saúde',sub:'Carga horária, periodicidade, reciclagem e aptidão médica.',
 goals:['Fixar 8 horas (inicial e periódico) e 2 anos (periodicidade)','Listar as situações que exigem novo treinamento','Relacionar ASO, aptidão e autorização do trabalhador'],
 exam:'Questões 1 e 4',
 inst:['0–20 min: exposição da capacitação inicial, periódica e eventual.','20–40 min: cenários "precisa reciclar?" (votação por cartão sim/não).','40–55 min: cartões numéricos em duplas.','55–60 min: fechamento e mini-prova.','Prática: conferir o certificado de um participante e checar se traz nome, conteúdo, carga horária, data, local, instrutor e assinatura.'],
 blocks:[
 {t:'cards',h:'Números que caem em prova',items:[['Treinamento inicial','Teórico e prático, mínimo de 8 horas, antes de iniciar a atividade.'],['Treinamento periódico','A cada 2 anos (bienal), com mínimo de 8 horas.'],['Capacitação eventual','Novo treinamento em mudança de procedimento ou condição, evento que mostre necessidade, afastamento superior a 90 dias ou mudança de empresa.'],['Horário','O treinamento deve ser realizado durante o horário normal de trabalho.']]},
 {t:'text',h:'Conteúdo mínimo, certificado e autorização',html:`<p>O conteúdo programático deve abordar, no mínimo: normas e regulamentos aplicáveis, análise de risco e condições impeditivas, riscos potenciais e medidas de prevenção, sistemas e equipamentos de proteção (seleção, inspeção, conservação e limitações de uso), acidentes típicos e condutas em emergências, incluindo noções de resgate e primeiros socorros.</p><p>Ao final, o participante recebe <strong>certificado</strong> com nome, conteúdo, carga horária, data, local, instrutor e responsável. A empresa mantém cópia arquivada.</p><p>Só executa trabalho em altura quem é <strong>capacitado, tem ASO com aptidão para altura e recebeu anuência formal (autorização) do empregador</strong>.</p>`},
 {t:'quiz',h:'Precisa fazer novo treinamento?',items:[
  {q:'Concluiu a capacitação há 1 ano e 6 meses e nada mudou no trabalho.',o:['Sim','Não'],a:1,why:'Ainda está dentro do prazo bienal.'},
  {q:'Voltou de licença de 120 dias.',o:['Sim','Não'],a:0,why:'Afastamento superior a 90 dias exige nova capacitação.'},
  {q:'Voltou de férias de 30 dias.',o:['Sim','Não'],a:1,why:'30 dias não passa de 90.'},
  {q:'Foi contratado por outra empresa e traz certificado da anterior.',o:['Sim','Não'],a:0,why:'Mudança de empresa exige capacitação na nova empresa.'},
  {q:'A empresa trocou o sistema de ancoragem e mudou o procedimento.',o:['Sim','Não'],a:0,why:'Mudança nos procedimentos, condições ou operações exige novo treinamento.'},
  {q:'O último treinamento foi há 25 meses.',o:['Sim','Não'],a:0,why:'Passou de 2 anos: reciclagem periódica vencida.'}]},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'Em condições normais, com que frequência é o treinamento periódico?',o:['A cada 6 meses','A cada 1 ano','A cada 2 anos','A cada 3 anos'],a:2,why:'Bienal: a cada 2 anos.'},
  {q:'Qual a carga horária mínima da capacitação inicial?',o:['4 horas','8 horas','16 horas','40 horas'],a:1,why:'Mínimo de 8 horas, teóricas e práticas. Este curso, de 12 horas, supera o mínimo.'}]},
 {t:'flash',h:'Cartões de revisão',items:[['Inicial','8 h, teoria + prática, antes de começar.'],['Periódico','A cada 2 anos, mínimo de 8 h.'],['Afastamento','Mais de 90 dias exige novo treinamento.']]}
 ]},
{id:'m4',day:1,title:'Análise de Risco, PO e PT',sub:'Os documentos que antecedem qualquer trabalho em altura.',
 goals:['Saber que toda atividade precisa de Análise de Risco','Distinguir PO (rotineira) de PT (não rotineira)','Diferenciar PT de PET'],
 exam:'Questões 2, 6 e 7',
 inst:['0–20 min: exposição dos três documentos com exemplos da empresa.','20–40 min: classificação PO x PT.','40–55 min: montar uma AR simples de uma tarefa real do grupo em quadro.','55–60 min: mini-prova.','Prática: preencher um modelo de PT com uma atividade não rotineira fictícia.'],
 blocks:[
 {t:'cards',h:'Os documentos',items:[['Análise de Risco (AR)','Obrigatória para todo trabalho em altura, rotineiro ou não. Considera o local e o entorno, isolamento e sinalização, ancoragens, clima, queda de materiais e ferramentas, trabalhos simultâneos e emergências.'],['Procedimento Operacional (PO)','Para atividades rotineiras: método padronizado e documentado.'],['Permissão de Trabalho (PT)','Para atividades não rotineiras: autorização prévia, válida só para o turno.'],['ASO','Atestado de Saúde Ocupacional. Comprova aptidão, não autoriza a atividade em si.']]},
 {t:'text',h:'PT, PET e supervisão',html:`<p>A <strong>PT</strong> tem validade limitada à duração da atividade, restrita ao turno, podendo ser revalidada se não mudarem as condições nem a equipe. Ela deve estar disponível no local.</p><div class="note warn"><strong>Não confunda:</strong> a <em>Permissão de Entrada e Trabalho (PET)</em> pertence à NR-33 (espaço confinado). Na NR-35 a permissão é a <em>PT</em>.</div><p>Todo trabalho em altura deve ser realizado <strong>sob supervisão</strong>, e a forma da supervisão é definida pela Análise de Risco conforme as peculiaridades da atividade.</p>`},
 {t:'classify',h:'PO ou PT?',buckets:['PO (rotineira)','PT (não rotineira)'],items:[
  ['Instalar CTO em poste, tarefa diária com método padronizado',0,'Rotineira, com procedimento definido: PO (sempre precedida de AR).'],
  ['Reparo emergencial em torre numa situação que a equipe nunca executou',1,'Não rotineira: precisa de PT.'],
  ['Ativação de clientes com escada de 2,5 m, mesmo método todos os dias',0,'Rotineira: PO.'],
  ['Primeira vez que a equipe troca um equipamento pesado no topo da torre',1,'Atividade nova e não rotineira: PT.']]},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'Atividades de trabalho em altura NÃO rotineiras devem ser autorizadas mediante:',o:['Permissão de Entrada e Trabalho – PET','Permissão de Trabalho – PT','Procedimento Operacional – PO','Atestado de Saúde Ocupacional – ASO'],a:1,why:'PT. A PET é da NR-33.'},
  {q:'Apenas o trabalho em altura não rotineiro precisa de Análise de Risco?',o:['Sim','Não, todo trabalho em altura precisa'],a:1,why:'A AR precede toda atividade, rotineira ou não.'},
  {q:'Qual documento considera o local e entorno, o isolamento e a sinalização, as ancoragens e a queda de materiais?',o:['PCMSO','SPCQ','SPIQ','Procedimento Operacional','Análise de Risco'],a:4,why:'É a Análise de Risco.'}]}
 ]},
{id:'m5',day:2,title:'Hierarquia das medidas de proteção',sub:'Evitar, proteger coletivamente, proteger individualmente.',
 goals:['Aplicar a ordem de prioridade das medidas','Montar a sequência segura antes de subir','Justificar por que o SPCQ vem antes do SPIQ'],
 exam:'Base para as questões 7, 8 e 9',
 inst:['0–15 min: hierarquia com exemplo de telecom (fazer a emenda no solo antes de subir).','15–30 min: atividade de ordenar.','30–50 min: discussão de casos reais do grupo.','50–60 min: mini-prova.'],
 blocks:[
 {t:'text',h:'A lógica da NR-35',html:`<p>Primeiro se pergunta se o trabalho em altura pode ser <strong>evitado</strong>. Quando não pode, adotam-se medidas que <strong>eliminem o risco de queda</strong> (proteção coletiva). Só quando isso não for possível se recorre a medidas que <strong>minimizem as consequências</strong> da queda (proteção individual).</p>`},
 {t:'order',h:'Ordene a hierarquia',steps:['Evitar o trabalho em altura (fazer no solo ou usar meio alternativo)','Eliminar o risco de queda com proteção coletiva (guarda-corpo, plataforma)','Minimizar as consequências da queda com proteção individual (SPIQ)']},
 {t:'order',h:'Ordene a sequência antes de subir',steps:['Ler a Análise de Risco e conferir PO ou PT','Verificar clima e condições impeditivas','Isolar e sinalizar a área abaixo','Inspecionar EPI, ancoragem e ferramentas','Conectar-se ao sistema antes de se expor ao risco']},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'Qual medida vem primeiro na ordem de prioridade?',o:['Cinturão e talabarte','Evitar o trabalho em altura','Treinamento de resgate','Sinalização'],a:1,why:'Evitar é a primeira medida, sempre que houver meio alternativo.'},
  {q:'O trabalhador precisa ficar conectado ao SPIQ durante todo o período de exposição ao risco de queda?',o:['Sim','Não'],a:0,why:'Sim. Afirmar que não é necessário é justamente a alternativa errada da questão 8.'}]}
 ]},
{id:'m6',day:2,title:'Proteção coletiva (SPCQ)',sub:'Guarda-corpo, rede, rodapé, plataformas e sinalização.',
 goals:['Reconhecer elementos de proteção coletiva','Distinguir SPCQ de SPIQ','Explicar por que a proteção coletiva é preferida'],
 exam:'Questão 9',
 inst:['0–15 min: exposição com fotos ou modelos reais.','15–35 min: atividade de classificação SPCQ x SPIQ.','35–50 min: prática de inspeção de um guarda-corpo (altura, rodapé, fixação).','50–60 min: mini-prova.'],
 blocks:[
 {t:'text',h:'O que é SPCQ',html:`<p>O <strong>Sistema de Proteção Coletiva Contra Quedas</strong> protege todos os que estão na área sem depender de ação individual: guarda-corpo com rodapé, redes de proteção, plataformas com fechamento, pisos e pranchas completos, telas e escadas com proteção, além de isolamento e sinalização da área.</p><p>Já o <strong>cinturão, o talabarte, o trava-quedas e os conectores</strong> pertencem ao <strong>SPIQ</strong> (proteção individual).</p><div class="note"><strong>Atenção:</strong> tecnicamente, cabo-guia e linha de vida são elementos de ancoragem do SPIQ, mas a questão 9 da prova os apresenta como coletivos. O item que certamente NÃO é coletivo é <em>cinto de segurança e talabarte</em>. Vale comentar essa ambiguidade em sala.</div>`},
 {t:'classify',h:'SPCQ ou SPIQ?',buckets:['SPCQ (coletivo)','SPIQ (individual)'],items:[
  ['Guarda-corpo com rodapé',0,'Barreira física que protege todos.'],
  ['Cinturão tipo paraquedista',1,'Equipamento usado por cada trabalhador.'],
  ['Rede de proteção',0,'Coletivo.'],
  ['Talabarte com absorvedor de energia',1,'Individual.'],
  ['Plataforma de trabalho com fechamento lateral',0,'Coletivo.'],
  ['Trava-quedas',1,'Individual.'],
  ['Conector (mosquetão) com trava dupla',1,'Individual: faz parte da conexão do SPIQ.'],
  ['Rodapé e prancha de piso',0,'Coletivo.']]},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'Qual item NÃO faz parte do Sistema de Proteção Coletiva Contra Quedas?',o:['Rede de proteção','Guarda-corpo com rodapé','Cinto de segurança e talabarte','Plataforma com fechamento'],a:2,why:'Cinto e talabarte são individuais (SPIQ).'}]}
 ]},
{id:'m7',day:2,title:'Proteção individual (SPIQ) e inspeção',sub:'Cinturão, talabarte, trava-quedas, conectores e inspeção antes do uso.',
 goals:['Nomear e descrever os componentes do SPIQ','Definir talabarte','Reprovar equipamento com defeito'],
 exam:'Questões 8 e 10',
 inst:['0–15 min: exposição com o kit real em mãos.','15–30 min: inspeção guiada, peça por peça.','30–50 min: PRÁTICA de ajuste do cinturão (peitoral, coxas, argola dorsal) e conexão correta do talabarte em dupla.','50–60 min: mini-prova.','Lembrar: verificar CA, validade e manual do fabricante.'],
 blocks:[
 {t:'cards',h:'Componentes do SPIQ',items:[['Cinturão tipo paraquedista','EPI com sustentação no peito, ombros e coxas. Distribui a força da parada e mantém o corpo em posição segura.'],['Talabarte','Dispositivo de conexão, regulável ou não, para sustentar, posicionar e/ou limitar a movimentação do trabalhador. Para retenção de queda usa-se absorvedor de energia.'],['Trava-quedas','Dispositivo que trava em caso de queda, acompanhando o trabalhador em movimentos verticais ou horizontais quando conectado ao cinturão.'],['Ancoragem e conectores','Ponto ou linha onde o sistema se prende, e conectores compatíveis entre si. A compatibilidade entre elementos é exigida na Análise de Risco.']]},
 {t:'text',h:'Antes do uso',html:`<p>Verifique sempre: <strong>CA válido, etiqueta legível, manual do fabricante, e inspeção visual completa</strong> a cada uso. Equipamento que sofreu queda, absorvedor acionado, corte, queima, corrosão ou contato com químicos é retirado de uso.</p>`},
 {t:'classify',h:'Inspeção: liberar ou reprovar?',buckets:['Liberar','Reprovar'],items:[
  ['Fita com fios cortados e costura aberta próxima à argola dorsal',1,'Costura e fita comprometidas: retirar de uso.'],
  ['Poeira seca na fita, que saiu com pano úmido; etiqueta legível e CA válido',0,'Sujeira leve removível não reprova o equipamento.'],
  ['Absorvedor de energia com a capa rasgada e fita exposta',1,'Absorvedor acionado ou danificado: nunca reutilizar.'],
  ['Mosquetão cuja trava não fecha sozinha',1,'Trava defeituosa: risco de abertura acidental.'],
  ['Etiqueta ilegível e sem identificação do fabricante',1,'Sem rastreabilidade não há como confirmar CA, validade nem histórico.'],
  ['Fivelas sem corrosão, fitas sem cortes, absorvedor íntegro, etiqueta ok',0,'Conforme: pode ser liberado.']]},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'De acordo com a NR-35, talabarte significa:',o:['Dispositivo de conexão de um sistema de segurança, regulável ou não, para sustentar, posicionar e/ou limitar a movimentação do trabalhador','Equipamento de proteção individual constituído de sustentação no peito, ombros e coxas','Elemento fixado de forma permanente na estrutura','Rede de proteção coletiva'],a:0,why:'A segunda alternativa define o cinturão, e a terceira, a ancoragem.'}]}
 ]},
{id:'m8',day:2,title:'Ancoragem, fator de queda e zona livre de queda',sub:'Calcule quanto espaço livre é preciso abaixo do trabalhador.',
 goals:['Definir distância de queda livre, fator de queda e zona livre de queda','Calcular a ZLQ com a calculadora','Escolher ancoragem que reduza o fator de queda'],
 exam:'Questão 8',
 inst:['0–15 min: definições no quadro com desenho da queda.','15–40 min: calculadora, em duplas, com 3 cenários (ancoragem acima da cabeça, nos pés e abaixo).','40–55 min: PRÁTICA de ancoragem em estrutura da empresa, identificando o ponto certo.','55–60 min: mini-prova.','Sempre usar os dados do manual do fabricante para o cálculo real.'],
 blocks:[
 {t:'cards',h:'Três definições da Análise de Risco',items:[['Distância de queda livre','Distância percorrida na queda antes de o sistema começar a frear o trabalhador.'],['Fator de queda','Altura de queda livre dividida pelo comprimento do talabarte. Vai de 0 a 2. Quanto maior, mais forte o impacto.'],['Zona livre de queda (ZLQ)','Espaço livre necessário abaixo do trabalhador para ele parar sem bater em solo ou obstáculo.']]},
 {t:'zlq'},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'Marque a alternativa ERRADA. A Análise de Risco do SPIQ deve considerar:',o:['Que não é necessário permanecer conectado ao sistema durante todo o período de exposição','Distância de queda livre','Fator de queda','Zona livre de queda','Compatibilidade entre os elementos do SPIQ'],a:0,why:'O trabalhador deve permanecer conectado durante toda a exposição ao risco de queda.'},
  {q:'Qual ancoragem produz o MENOR fator de queda?',o:['Ancoragem acima da cabeça','Ancoragem na altura dos pés','Ancoragem abaixo dos pés'],a:0,why:'Com o ponto acima, a queda livre é curta ou nula.'}]}
 ]},
{id:'m9',day:2,title:'Acessos e equipamentos',sub:'Escadas, andaimes, plataformas, postes, torres e acesso por corda.',
 goals:['Tomar decisão segura na hora de escolher o acesso','Reconhecer situações que exigem parar','Relacionar trabalho em altura com riscos elétricos'],
 exam:'Aplicação prática',
 inst:['0–15 min: exposição rápida dos acessos usados pela empresa.','15–40 min: casos de decisão em duplas.','40–55 min: PRÁTICA supervisionada em escada e/ou estrutura, com ancoragem e comunicação.','55–60 min: mini-prova.','Ajustar os exemplos ao acesso real (poste, torre, telhado, andaime).'],
 blocks:[
 {t:'cards',h:'Acessos mais comuns',items:[['Escadas portáteis','Firmes, em bom estado, fixadas ou seguradas, com três pontos de apoio. Não substituem o SPIQ quando exigido pela Análise de Risco.'],['Andaimes','Montados e liberados por pessoal habilitado, com piso completo, guarda-corpo e rodapé.'],['Postes e torres','Riscos de queda, de rede elétrica próxima (NR-10) e de resgate difícil. Ancoragem contínua durante a subida.'],['Acesso por corda','Regras próprias no Anexo I da NR-35: cabos independentes, equipe treinada e plano de resgate.']]},
 {t:'quiz',h:'O que fazer?',items:[
  {q:'A escada de 6 m está encostada num poste sem fixação e sem ninguém segurando.',o:['Subir rápido para reduzir o tempo de exposição','Fixar ou travar a escada, ou trocar o acesso, antes de subir','Pedir para o colega segurar só com uma mão'],a:1,why:'Acesso instável é situação para corrigir antes de começar.'},
  {q:'O andaime do último nível está sem guarda-corpo.',o:['Trabalhar conectado e seguir','Interromper e solicitar correção','Improvisar com corda solta'],a:1,why:'Sem proteção coletiva completa, a atividade é interrompida até a correção.'},
  {q:'Há rede de energia a menos de 1 m do ponto de trabalho no poste.',o:['Trabalhar com muito cuidado','Não iniciar sem procedimento, habilitação e autorização para o risco elétrico (NR-10)','Desligar a luz do poste com uma vara'],a:1,why:'Risco adicional elétrico exige controle próprio antes de qualquer subida.'},
  {q:'Uma ferramenta pesada está solta e pode cair sobre quem passa embaixo.',o:['Avisar quem passa e continuar','Prender a ferramenta, isolar e sinalizar a área abaixo','Trabalhar rápido para terminar logo'],a:1,why:'A queda de materiais é risco previsto na Análise de Risco. Isolamento e sinalização são medidas obrigatórias.'}]}
 ]},
{id:'m10',day:2,title:'Condições impeditivas e riscos adicionais',sub:'Quando iniciar e quando interromper.',
 goals:['Listar condições impeditivas','Decidir entre iniciar e interromper','Reconhecer riscos adicionais'],
 exam:'Aplicação prática',
 inst:['0–10 min: definição de condição impeditiva.','10–40 min: simulador "iniciar ou interromper" com discussão de cada decisão.','40–55 min: construir uma lista de verificação para a realidade da empresa.','55–60 min: mini-prova.'],
 blocks:[
 {t:'text',h:'Condição impeditiva',html:`<p>É toda situação que <strong>impede a realização</strong> ou <strong>obriga a interrupção</strong> da atividade. Exemplos: chuva forte, vento forte, descargas atmosféricas, iluminação insuficiente, trabalhador com mal-estar, equipamento danificado, ausência de AR/PO/PT, ancoragem duvidosa e trabalhador sem capacitação ou sem autorização.</p><p>Riscos adicionais que também entram na Análise de Risco: queda de materiais, trabalhos simultâneos em níveis diferentes, rede elétrica, animais peçonhentos, atmosfera perigosa e isolamento do local.</p>`},
 {t:'classify',h:'Iniciar ou interromper?',buckets:['Iniciar','Interromper'],items:[
  ['Céu aberto, PT emitida, EPI inspecionado, área isolada',0,'Condições atendidas.'],
  ['Trovoadas com raios se aproximando',1,'Descarga atmosférica é condição impeditiva.'],
  ['Trabalhador relata tontura antes de subir',1,'Mal-estar é condição impeditiva: não deve executar.'],
  ['Falta a PT em atividade não rotineira',1,'Sem autorização prévia não se inicia.'],
  ['Talabarte com absorvedor rasgado',1,'Equipamento danificado.'],
  ['Trabalhador com capacitação vigente, ASO apto e autorização formal',0,'Requisitos cumpridos.']]},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'Um trabalhador pode interromper a atividade se achar que há risco grave e iminente?',o:['Não, apenas o encarregado pode decidir','Sim, ele deve interromper e informar o superior'],a:1,why:'É dever do trabalhador e o empregador deve assegurar a suspensão.'}]}
 ]},
{id:'m11',day:2,title:'Emergência e salvamento',sub:'Plano de resgate, primeiros socorros e síndrome da suspensão.',
 goals:['Ordenar as etapas de resposta a uma queda','Explicar por que o resgate deve ser rápido','Reconhecer o papel da equipe de emergência'],
 exam:'Questão 5 (equipe de salvamento)',
 inst:['0–15 min: exposição do plano de emergência da empresa e contatos.','15–30 min: atividade de ordenar.','30–55 min: PRÁTICA de simulado de resgate de trabalhador suspenso (boneco), com cronômetro.','55–60 min: mini-prova.','Protocolo de primeiros socorros e técnicas de resgate são conduzidos pelo instrutor habilitado.'],
 blocks:[
 {t:'text',h:'Por que o resgate é urgente',html:`<p>Um trabalhador que fica <strong>suspenso e imóvel no cinturão</strong> corre risco de vida em pouco tempo: a circulação nas pernas é prejudicada e pode ocorrer a chamada <strong>síndrome da suspensão</strong>. Por isso o <strong>plano de resgate deve existir antes</strong> de a atividade começar, com equipe, equipamentos e treinamento definidos.</p><div class="note"><strong>Depois do resgate</strong> toda vítima de suspensão deve ser avaliada por serviço médico, mesmo sem sintomas. As posições e os procedimentos de primeiros socorros seguem o protocolo do instrutor habilitado.</div>`},

/* ======================= PROGRESSO E BLOQUEIO ======================= */
const idx=id=>M.findIndex(x=>x.id===id);
function keysOf(mod){const k=[];mod.blocks.forEach((b,i)=>{if(['text','cards','order','zlq'].includes(b.t))k.push('b'+i);else if(['flash','quiz','classify'].includes(b.t))b.items.forEach((_,j)=>k.push(`b${i}.${j}`))});return k}
function missing(id){const u=S.units[id]||{};return keysOf(M[idx(id)]).filter(k=>!u[k]).length}
function pctOf(id){const ks=keysOf(M[idx(id)]);return ks.length?Math.round((ks.length-missing(id))/ks.length*100):0}
function firstOpen(){const i=M.findIndex(x=>!S.passed[x.id]);return i<0?M.length-1:i}
function unlocked(i){return i<=firstOpen()}
let CUR=null,NOTICE='';
function unit(id,key){const u=S.units[id]=S.units[id]||{};if(u[key])return;u[key]=true;save();if(CUR===id)refreshProg()}
function refreshProg(){if(!CUR)return;const p=pctOf(CUR);const a=$('#mpct'),b=$('#mbar');if(a){a.textContent=p+'%';b.style.width=p+'%'}
 const st=$('#mstat');if(st)st.textContent=evalStatus(CUR);drawTop();drawNav(CUR);
 const box=$('#evalbox');if(box&&p===100&&box.dataset.open!=='1')box._draw()}
function evalStatus(id){if(S.passed[id])return `Avaliação: aprovado com ${Math.round(S.score[id]*100)}%`;return pctOf(id)===100?'Avaliação: liberada':`Avaliação: bloqueada até 100% do conteúdo (faltam ${missing(id)} atividades)`}

/* ======================= RENDERIZADORES ======================= */
function readBtn(mod,key){const done=(S.units[mod]||{})[key];const b=h('button',{class:'act alt rd'+(done?' done':''),type:'button',onclick:()=>{unit(mod,key);b.classList.add('done');b.textContent='Lido';b.disabled=true}},done?'Lido':'Marcar como lido');if(done)b.disabled=true;return b}
function bQuiz(b,mod,bi){const w=h('div',{class:'block'},h('h3',{},b.h||'Mini-quiz'));
 b.items.forEach((it,qi)=>{const card=h('div',{class:'q'});const fb=h('p',{class:'fb',hidden:''});
  const two=it.o.length===2;const box=h('div',{class:'opts'+(two?' two':'')});
  const btns=it.o.map((o,oi)=>h('button',{class:'opt',type:'button',onclick:()=>{if(card.dataset.d)return;card.dataset.d=1;const ok=oi===it.a;btns.forEach((x,i)=>{x.disabled=true;if(i===it.a)x.classList.add('right');else if(i===oi)x.classList.add('wrong')});fb.hidden=false;fb.className='fb '+(ok?'ok':'bad');fb.textContent=(ok?'Correto. ':'Não é essa. ')+(it.why||'');rec(mod,ok,it.q);unit(mod,`b${bi}.${qi}`)}},o));
  btns.forEach(x=>box.append(x));card.append(h('p',{class:'qt'},`${qi+1}. ${it.q}`),box,fb);w.append(card)});return w}
function bClassify(b,mod,bi){const w=h('div',{class:'block'},h('h3',{},b.h));
 b.items.forEach(([t,bk,why],ri)=>{const row=h('div',{class:'crow'});const fb=h('p',{class:'fb',hidden:''});
  const btns=b.buckets.map((bn,i)=>h('button',{class:'opt',type:'button',onclick:()=>{if(row.dataset.d)return;row.dataset.d=1;const ok=i===bk;btns.forEach((x,j)=>{x.disabled=true;if(j===bk)x.classList.add('right');else if(j===i)x.classList.add('wrong')});fb.hidden=false;fb.className='fb '+(ok?'ok':'bad');fb.textContent=(ok?'Correto. ':`Resposta: ${b.buckets[bk]}. `)+why;rec(mod,ok,t);unit(mod,`b${bi}.${ri}`)}},bn));
  row.append(h('span',{},t),h('div',{class:'btns'},btns),fb);w.append(row)});return w}
function bOrder(b,mod,bi){const w=h('div',{class:'block'},h('h3',{},b.h),h('p',{},'Use as setas para colocar as etapas na ordem correta e clique em Verificar.'));
 let arr=b.steps.map((s,i)=>({s,i}));
 do{arr.sort(()=>Math.random()-.5)}while(arr.every((x,i)=>x.i===i)&&arr.length>1);
 const ul=h('ol',{class:'ord'});const fb=h('p',{class:'fb',hidden:''});let locked=false;
 function draw(res){ul.innerHTML='';arr.forEach((x,i)=>{const li=h('li',{},h('span',{},`${i+1}. ${x.s}`));
  if(res)li.classList.add(x.i===i?'right':'wrong');
  if(!locked){li.append(h('button',{class:'mv',type:'button','aria-label':'Subir',onclick:()=>{if(i>0){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];draw()}}},'▲'),h('button',{class:'mv',type:'button','aria-label':'Descer',onclick:()=>{if(i<arr.length-1){[arr[i+1],arr[i]]=[arr[i],arr[i+1]];draw()}}},'▼'))}
  ul.append(li)})}
 draw();
 const btn=h('button',{class:'act',type:'button',onclick:()=>{const ok=arr.every((x,i)=>x.i===i);locked=true;btn.disabled=true;draw(true);fb.hidden=false;fb.className='fb '+(ok?'ok':'bad');fb.innerHTML=ok?'Ordem correta.':'Ordem correta: '+b.steps.map((s,i)=>`${i+1}. ${s}`).join(' → ');rec(mod,ok,b.h);unit(mod,'b'+bi)}},'Verificar ordem');

const fmtNota=p=>(p/10).toFixed(1).replace('.',',');
const fmtNotaFull=p=>p==null?'—':`${fmtNota(p)} (${p}%)`;

function fmtMin(s){const m=Math.round((s||0)/60);return m>=60?`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')} min`:`${m} min`}
function agoTxt(iso){if(!iso)return '—';const s=(Date.now()-new Date(iso))/1000;if(s<120)return 'agora';if(s<3600)return `há ${Math.round(s/60)} min`;if(s<86400)return `há ${Math.round(s/3600)} h`;return `há ${Math.round(s/86400)} d`}
const isOnline=a=>!!a.lastSeen&&!a.finishedAt&&Date.now()-new Date(a.lastSeen)<130000;
const digits=c=>(c||'').replace(/\D/g,'');
function fmtCpf(c){c=digits(c);return c.length===11?`${c.slice(0,3)}.${c.slice(3,6)}.${c.slice(6,9)}-${c.slice(9)}`:c}
function maskCpf(c){c=digits(c);return c.length===11?`***.${c.slice(3,6)}.${c.slice(6,9)}-**`:c}
function cpfOk(c){c=digits(c);if(c.length!==11||/^(\d)\1+$/.test(c))return false;const d=n=>{let s=0;for(let i=0;i<n;i++)s+=+c[i]*(n+1-i);const r=s*10%11;return r===10?0:r};return d(9)===+c[9]&&d(10)===+c[10]}

 const linhas=rows.map(r=>`${String(r.n).padStart(2,'0')}. ${r.titulo} | nota ${fmtNotaFull(r.nota)} | ${r.tent} tentativa(s) | ${fmtMin(r.seg)}`).join('\n');

async function afterLogin(){const uid=SESSION.user.id;UID=uid;ME=null;
 let adm=false;try{const r=await SB.from('admins').select('user_id').eq('user_id',uid).maybeSingle();adm=!!r.data}catch(e){}
 ISOWNER=adm;$('#outBtn').hidden=false;
 if(adm){$('#instBtn').hidden=false;return showPanel()}
 MYREF=makeRef(uid);let snap=null;
 try{snap=await MYREF.get()}catch(e){return renderBloqueio('Não foi possível carregar o seu registro. Confira a internet e recarregue a página.')}
 if(!snap.exists){return renderRegistro()}
 loadAluno(snap.data());MODE='aluno';setSync('Progresso sincronizado');
 const hsh=(location.hash||'#home').slice(1);render(M.find(x=>x.id===hsh)||hsh==='resumo'||hsh==='home'?hsh:'home')}
async function sair(){try{await push();await flushResp()}catch(e){}
 try{await SB.auth.signOut()}catch(e){}
 SESSION=null;UID=null;MYREF=null;ME=null;ISOWNER=false;S=newState();ALUNOS=[];LOADED=false;SEL=null;RESP={};$('#instBtn').hidden=true;$('#panelBtn').hidden=true;try{history.replaceState(null,'','#')}catch(e){}renderLogin('entrar')}
async function boot(){$('#main').append(h('p',{},'Carregando...'));
 const cfg=window.APP_CONFIG;
 if(!window.supabase||!cfg||!cfg.SUPABASE_URL||/SEU-PROJETO|COLE_AQUI/i.test(cfg.SUPABASE_URL)){return renderBloqueio('Configuração pendente: preencha o arquivo config.js com a URL e a chave do Supabase, como descrito no LEIA-ME.')}
 SB=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
 SB.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){RECOVERY=true;if(MODE!=='boot')setTimeout(renderNovaSenha,0)}});
 let sess=null;try{const r=await SB.auth.getSession();sess=r.data.session}catch(e){}
 SESSION=sess;
 if(RECOVERY&&sess)return renderNovaSenha();
 if(!sess)return renderLogin('entrar');
 await afterLogin()}
$('#instBtn').addEventListener('click',()=>{S.inst=!S.inst;save();render((location.hash||'#home').slice(1))});
$('#panelBtn').addEventListener('click',()=>go('panel'));
$('#outBtn').addEventListener('click',sair);
boot();
</script>
