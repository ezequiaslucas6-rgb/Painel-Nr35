 {t:'cards',h:'Conceitos que sustentam a AR',items:[['Perigo','Fonte com potencial de causar dano. Ex.: borda de laje sem proteção.'],['Risco','Combinação da probabilidade de o dano acontecer com a severidade desse dano.'],['Medida de controle','Ação que elimina o perigo ou reduz a probabilidade ou a severidade.'],['Risco residual','O que sobra depois dos controles. Precisa ser aceitável antes de começar.']]},
 {t:'text',h:'O que uma boa AR de altura precisa responder',html:`<ul><li>Onde e como será o acesso, e qual o entorno (tráfego, rede elétrica, pessoas embaixo).</li><li>Quais sistemas de proteção serão usados: coletivo primeiro, individual depois.</li><li>Onde estão os pontos de ancoragem e qual a sua resistência conhecida.</li><li>Qual a zona livre de queda disponível e a necessária.</li><li>Quais são as condições impeditivas (clima, saúde, iluminação).</li><li>Como será a comunicação e o <strong>resgate</strong>, com tempo de resposta.</li><li>Como serão isoladas a área e a queda de materiais e ferramentas.</li></ul>`},
 {t:'order',h:'Ordene as etapas da Análise de Risco',steps:['Descrever a atividade e o local','Identificar os perigos','Avaliar os riscos (probabilidade e severidade)','Definir as medidas de controle pela hierarquia','Verificar se o risco residual é aceitável','Comunicar a equipe e registrar']},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'Uma borda de telhado sem proteção é:',o:['Um risco','Um perigo','Uma medida de controle','Um risco residual'],a:1,why:'É a fonte do dano possível: um perigo. O risco depende de probabilidade e severidade.'},
  {q:'Depois de aplicar os controles, o risco residual continua alto. O que fazer?',o:['Começar com mais atenção','Rever o planejamento e adicionar controles antes de começar','Pedir ao trabalhador mais experiente para ir','Reduzir o tempo de exposição e começar'],a:1,why:'Só se inicia com risco residual aceitável.'},
  {q:'Qual controle tem MAIOR eficácia?',o:['Placa de aviso','Treinamento','Guarda-corpo fixo','Fazer a tarefa no solo, sem subir'],a:3,why:'Eliminar a exposição está no topo da hierarquia.'}]}
 ]},
{id:'a3',stage:2,day:3,title:'Permissão de Trabalho na prática',sub:'Emissão, conteúdo, revalidação, encerramento e arquivo da PT.',
 goals:['Reconhecer o conteúdo mínimo de uma PT','Saber quando a PT pode ser revalidada','Encerrar e arquivar a PT corretamente'],
 exam:'Questões 5 e 6',
 inst:['0–15 min: mostrar um modelo de PT da empresa.','15–40 min: preencher uma PT em duplas a partir de um caso.','40–50 min: discutir revalidação e encerramento.','50–60 min: mini-prova e avaliação.'],
 blocks:[
 {t:'text',h:'Ciclo de vida da PT',html:`<p>A PT deve ser <strong>emitida</strong>, <strong>aprovada</strong> pelo responsável pela autorização, <strong>disponibilizada no local</strong> da atividade e, ao final, <strong>encerrada e arquivada</strong> de forma a permitir a rastreabilidade.</p><p>Ela deve conter, no mínimo: os <strong>requisitos mínimos</strong> a serem atendidos para a execução, as <strong>disposições e medidas da Análise de Risco</strong> e a <strong>relação de todos os envolvidos</strong> e suas autorizações.</p><p>A validade é <strong>limitada à duração da atividade e restrita ao turno</strong>. Ela pode ser <strong>revalidada</strong> pelo responsável pela aprovação quando <strong>não houver mudança</strong> nas condições estabelecidas nem na equipe.</p>`},
 {t:'order',h:'Ordene o ciclo da PT',steps:['Planejar com base na Análise de Risco','Emitir a PT','Aprovar pelo responsável pela autorização','Disponibilizar no local da atividade','Executar o trabalho conforme a PT','Encerrar a PT','Arquivar para rastreabilidade']},
 {t:'quiz',h:'Pode revalidar a PT?',items:[
  {q:'O turno acabou, a atividade continua amanhã com a mesma equipe e as mesmas condições.',o:['Pode revalidar','Precisa de nova PT'],a:0,why:'Sem mudança de condições e de equipe, o responsável pela aprovação pode revalidar.'},
  {q:'Um novo trabalhador vai entrar na equipe.',o:['Pode revalidar','Precisa de nova PT'],a:1,why:'Mudou a equipe: a relação de envolvidos e autorizações muda.'},
  {q:'O ponto de ancoragem previsto foi danificado e será usado outro.',o:['Pode revalidar','Precisa de nova PT'],a:1,why:'Mudou uma condição da AR: nova análise e nova PT.'},
  {q:'A atividade terminou. O que fazer com a PT?',o:['Jogar fora','Encerrar e arquivar','Guardar com o trabalhador','Reaproveitar na próxima tarefa'],a:1,why:'Encerrar e arquivar permite a rastreabilidade.'}]}
 ]},
{id:'a4',stage:2,day:3,title:'Sistemas de ancoragem',sub:'Anexo II da NR-35: tipos, projeto, instalação e inspeção.',
 goals:['Diferenciar ancoragem definitiva de provisória','Reconhecer quem projeta e quem inspeciona','Escolher um ponto de ancoragem confiável em campo'],
 exam:'Questões 7 e 8',
 inst:['0–15 min: mostrar exemplos reais de ancoragens da empresa (placas, chumbadores, fitas).','15–35 min: exposição sobre o Anexo II.','35–50 min: PRÁTICA: avaliar pontos de ancoragem do local (aprova ou reprova?).','50–60 min: mini-prova e avaliação.'],
 blocks:[
 {t:'cards',h:'Tipos de sistema de ancoragem',items:[['Definitivo','Fica instalado de forma permanente na estrutura. Precisa de projeto e identificação, com inspeção periódica.'],['Provisório','Instalado para uma atividade e retirado depois. Ex.: fita de ancoragem em viga, tripé.'],['Ponto de ancoragem','Local onde o trabalhador conecta o seu sistema de proteção.'],['Dispositivo de ancoragem','Elemento que liga o sistema à estrutura: olhal, fita, cinta, chumbador.']]},
 {t:'text',h:'Regras que não podem falhar',html:`<ul><li>O sistema de ancoragem deve ter <strong>projeto ou especificação técnica</strong> elaborados por <strong>profissional legalmente habilitado</strong>, com a resistência conhecida.</li><li>A instalação segue o projeto e as instruções do fabricante.</li><li>Ancoragens definitivas devem ser <strong>identificadas</strong> e ter <strong>inspeção periódica</strong> registrada.</li><li>Todo sistema é <strong>inspecionado antes do uso</strong>. Na dúvida, não se conecta.</li><li>Nunca use como ancoragem: tubulação, eletrocalha, corrimão comum, telha, andaime não projetado para isso ou o cinturão de um colega.</li></ul><div class="note warn"><strong>Após uma queda</strong>, o sistema de ancoragem que reteve o trabalhador deve ser retirado de uso até avaliação.</div>`},
 {t:'classify',h:'Serve como ancoragem?',buckets:['Pode servir (com avaliação)','Nunca usar'],items:[
  ['Olhal com placa de identificação e inspeção em dia',0,'Ancoragem identificada e inspecionada é a opção certa.'],
  ['Tubulação de gás ou de água',1,'Tubulações não são projetadas para reter quedas.'],
  ['Viga metálica estrutural com fita de ancoragem certificada',0,'Com avaliação da estrutura e fita adequada, é ancoragem provisória comum.'],
  ['Eletrocalha de cabos',1,'Não tem resistência conhecida e pode ter risco elétrico.'],
  ['Corrimão de escada comum',1,'Corrimão é para apoio da mão, não para reter queda.'],
  ['Linha de vida definitiva instalada conforme projeto',0,'Sistema projetado para essa finalidade.']]},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'Quem deve elaborar o projeto de um sistema de ancoragem definitivo?',o:['Qualquer trabalhador capacitado','Profissional legalmente habilitado','O vendedor do EPI','O próprio usuário'],a:1,why:'Projeto e especificação são de profissional legalmente habilitado.'},
  {q:'Um ponto de ancoragem segurou uma queda. O que fazer?',o:['Continuar usando','Retirar de uso até avaliação','Pintar de outra cor','Usar só para trabalhos leves'],a:1,why:'Pode ter sofrido dano invisível. Fica fora de uso até avaliação.'}]}
 ]},
{id:'a5',stage:2,day:3,title:'Linhas de vida horizontais e verticais',sub:'Flecha, número de usuários e o espaço extra que a linha exige.',
 goals:['Entender a deflexão (flecha) da linha de vida','Respeitar o número máximo de usuários','Escolher entre linha flexível e rígida'],
 exam:'Questão 9',
 inst:['0–15 min: desenho no quadro de uma linha de vida horizontal antes e depois da queda.','15–35 min: exposição e cartões.','35–50 min: PRÁTICA: identificar a placa da linha de vida (usuários, vão, inspeção).','50–60 min: mini-prova e avaliação.'],
 blocks:[
 {t:'text',h:'A flecha muda a conta',html:`<p>Quando alguém cai preso a uma <strong>linha de vida horizontal flexível</strong> (cabo de aço ou corda), o cabo se deforma e forma um "V". Essa deformação é a <strong>flecha</strong> ou <strong>deflexão</strong>.</p><p>A flecha <strong>aumenta a distância total de queda</strong>, então a <strong>zona livre de queda necessária é maior</strong> do que com um ponto fixo. O valor da flecha vem do projeto da linha e depende do vão, da tensão do cabo e do número de pessoas conectadas.</p><div class="note warn">Nunca conecte mais pessoas do que o número indicado no projeto ou na placa da linha. Cada usuário a mais aumenta a carga e a flecha.</div>`},
 {t:'cards',h:'Tipos de linha de vida',items:[['Horizontal flexível','Cabo ou corda tensionada entre ancoragens. Tem flecha na queda.'],['Horizontal rígida','Trilho metálico. Pouca ou nenhuma deflexão.'],['Vertical flexível','Corda ou cabo vertical com trava-quedas guiado.'],['Vertical rígida','Trilho ou cabo fixo em escadas tipo marinheiro e torres, com trava-quedas próprio.']]},
 {t:'flash',h:'Cartões de revisão',items:[['Flecha','Deformação da linha flexível durante a retenção da queda.'],['Efeito da flecha','Aumenta a ZLQ necessária.'],['Número de usuários','Nunca acima do previsto no projeto ou na placa.'],['Linha provisória','Também precisa de especificação técnica e montagem conforme o fabricante.']]},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'Comparado a um ponto fixo acima da cabeça, a linha de vida horizontal flexível exige:',o:['Menos zona livre de queda','A mesma zona livre de queda','Mais zona livre de queda, por causa da flecha','Nenhuma zona livre de queda'],a:2,why:'A deflexão do cabo soma-se à distância de queda.'},
  {q:'A placa da linha de vida indica no máximo 2 usuários. Chegou um terceiro trabalhador. O que fazer?',o:['Conectar os três com cuidado','Usar outro sistema para o terceiro','Conectar o terceiro só por alguns minutos','Prender o terceiro no cinturão de um colega'],a:1,why:'O limite de usuários do projeto não pode ser ultrapassado.'}]}
 ]},
{id:'a6',stage:2,day:3,title:'Trava-quedas retrátil e guiado',sub:'Uso correto, teste antes do uso e cuidado com bordas.',
 goals:['Diferenciar trava-quedas retrátil de guiado','Fazer o teste funcional antes do uso','Reconhecer o risco de uso horizontal sobre bordas'],
 exam:'Questão 10',
 inst:['0–10 min: mostrar um trava-quedas retrátil e um guiado.','10–30 min: exposição e teste funcional demonstrado.','30–50 min: PRÁTICA: cada participante faz a inspeção e o teste de travamento.','50–60 min: mini-prova e avaliação.'],
 blocks:[
 {t:'cards',h:'Dois equipamentos, dois usos',items:[['Retrátil','O cabo ou fita recolhe e solta conforme o movimento e trava em velocidade de queda. Normalmente instalado ACIMA do usuário.'],['Guiado','Corre em uma linha vertical (rígida ou flexível) e trava quando o trabalhador cai. Deve ser compatível com a linha usada.']]},
 {t:'text',h:'Cuidados que evitam acidentes',html:`<ul><li><strong>Teste funcional antes de cada uso:</strong> puxe o cabo de forma brusca. Ele deve travar. Depois, deve recolher sem travar sozinho.</li><li>O retrátil deve ficar, em regra, <strong>acima do usuário</strong>. Uso na horizontal ou com ancoragem nos pés só com modelo próprio para isso, conforme o fabricante.</li><li><strong>Bordas</strong>: o cabo passando sobre aresta viva pode ser cortado na queda. Só use sobre borda o modelo indicado pelo fabricante para essa situação.</li><li>Nunca solte o cabo retrátil de uma vez. Acompanhe o recolhimento.</li><li>O trava-quedas guiado deve ser do tipo e do diâmetro compatíveis com a linha. Não se mistura marca e modelo sem indicação do fabricante.</li></ul>`},
 {t:'order',h:'Ordene a verificação do retrátil',steps:['Conferir CA, etiqueta e data da última inspeção','Inspecionar a carcaça, o cabo ou fita e o conector','Fazer o teste de travamento puxando de forma brusca','Verificar se recolhe sem travar sozinho','Conectar ao ponto de ancoragem acima do usuário','Conectar à argola dorsal do cinturão']},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'O retrátil não travou no teste de puxão. O que fazer?',o:['Usar com cuidado','Retirar de uso e encaminhar para avaliação','Lubrificar e usar','Usar só em baixa altura'],a:1,why:'Falha no teste funcional retira o equipamento de uso.'},
  {q:'Onde se instala, em regra, o trava-quedas retrátil?',o:['Abaixo dos pés','Acima do usuário','Na cintura','Em qualquer posição'],a:1,why:'Acima do usuário reduz a queda livre. Outras posições só com modelo próprio.'}]}
 ]},
{id:'a7',stage:2,day:3,title:'Progressão com 100% de conexão',sub:'Talabarte duplo (em Y) e a regra de nunca ficar desconectado.',
 goals:['Progredir em estruturas sem ficar desconectado','Usar corretamente o talabarte em Y','Evitar conexões erradas no cinturão'],
 exam:'Questão 11',
 inst:['0–10 min: mostrar o talabarte em Y e os pontos do cinturão.','10–25 min: exposição.','25–50 min: PRÁTICA: progressão horizontal em estrutura baixa trocando os conectores.','50–60 min: mini-prova e avaliação.'],
 blocks:[
 {t:'text',h:'A regra dos 100%',html:`<p>Durante toda a exposição ao risco de queda o trabalhador deve <strong>permanecer conectado</strong>. Ao passar por um obstáculo, a técnica é usar o <strong>talabarte duplo (em Y)</strong>: conecta-se a perna livre no novo ponto <strong>antes</strong> de soltar a perna anterior.</p><div class="note warn"><strong>Erro comum:</strong> prender a perna livre do talabarte em Y na argola lateral ou frontal do cinturão. Em uma queda, isso pode transferir a força pelo caminho errado e anular o absorvedor. A perna sem uso fica no <strong>ponto de descanso</strong> indicado pelo fabricante.</div>`},
 {t:'order',h:'Ordene a passagem por um obstáculo',steps:['Estar conectado com a perna A no ponto 1','Conectar a perna B no ponto 2, depois do obstáculo','Conferir que o conector da perna B está fechado e travado','Soltar a perna A do ponto 1','Guardar a perna A no ponto de descanso do cinturão']},
 {t:'cards',h:'Pontos do cinturão',items:[['Argola dorsal','Retenção de queda. É onde se conecta o talabarte com absorvedor e o trava-quedas.'],['Argola frontal (peitoral)','Retenção de queda quando indicada pelo fabricante, como em linha vertical.'],['Argolas laterais','Posicionamento no trabalho (ex.: poste). Não servem para retenção de queda.'],['Argola ventral','Posicionamento e acesso por corda, conforme o fabricante.']]},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'Ao passar por uma viga, qual a sequência correta?',o:['Soltar a perna A e depois conectar a perna B','Conectar a perna B e depois soltar a perna A','Soltar as duas e passar rápido','Segurar a viga e passar sem conexão'],a:1,why:'Primeiro conecta a nova, depois solta a anterior: 100% conectado.'},
  {q:'As argolas laterais do cinturão servem para:',o:['Retenção de queda','Posicionamento no trabalho','Pendurar ferramentas pesadas','Resgate'],a:1,why:'Laterais são para posicionamento. Retenção é na argola dorsal (ou frontal, se indicada).'}]}
 ]},
{id:'a8',stage:2,day:4,title:'Cálculo de zona livre de queda',sub:'Exercícios com fator de queda e espaço livre necessário.',
 goals:['Calcular queda livre, fator de queda e ZLQ','Comparar posições de ancoragem','Decidir se o espaço disponível é suficiente'],
 exam:'Questões 12 e 13',
 inst:['0–10 min: relembrar as fórmulas.','10–40 min: calculadora em duplas com os 3 exercícios.','40–50 min: correção no quadro.','50–60 min: mini-prova e avaliação.'],
 blocks:[
 {t:'text',h:'As três contas',html:`<p><strong>Queda livre</strong> = (altura da argola dorsal − altura da ancoragem) + comprimento do talabarte. Nunca é menor que zero.</p><p><strong>Fator de queda</strong> = queda livre ÷ comprimento do talabarte.</p><p><strong>ZLQ necessária</strong> = queda livre + extensão do absorvedor aberto + folga de segurança.</p><div class="note">Exemplo com talabarte de 1,5 m, argola a 1,5 m dos pés, absorvedor de 1,75 m e folga de 1,0 m: com ancoragem nos pés, a queda livre é 3,0 m, o fator é 2 e a ZLQ é 5,75 m. Com ancoragem a 2,0 m dos pés, a queda livre cai para 1,0 m e a ZLQ para 3,75 m.</div>`},
 {t:'zlq'},
 {t:'quiz',h:'Exercícios',items:[
  {q:'Queda livre de 3,0 m com talabarte de 1,5 m. Qual o fator de queda?',o:['0,5','1','2','3'],a:2,why:'3,0 ÷ 1,5 = 2. É o pior caso.'},
  {q:'Queda livre 1,0 m, absorvedor aberto 1,75 m, folga 1,0 m. Qual a ZLQ necessária?',o:['2,75 m','3,75 m','4,75 m','1,75 m'],a:1,why:'1,0 + 1,75 + 1,0 = 3,75 m.'},
  {q:'A ZLQ necessária é 5,75 m e há 4,0 m livres até o solo. O que fazer?',o:['Trabalhar assim mesmo','Reposicionar a ancoragem mais alto ou mudar de sistema','Usar um talabarte mais longo','Diminuir a folga para zero'],a:1,why:'Espaço insuficiente: reduza a queda livre (ancoragem acima) ou use outro sistema, como retrátil.'},
  {q:'Usar um talabarte mais longo, com o mesmo ponto de ancoragem, faz a ZLQ necessária:',o:['Diminuir','Aumentar','Ficar igual','Zerar'],a:1,why:'O comprimento do talabarte entra na queda livre.'}]}
 ]},
{id:'a9',stage:2,day:4,title:'Força de impacto e absorvedor de energia',sub:'Por que o absorvedor existe e quando ele precisa ser descartado.',
 goals:['Explicar a função do absorvedor de energia','Relacionar fator de queda com força de impacto','Reconhecer absorvedor acionado'],
 exam:'Questão 14',
 inst:['0–15 min: demonstração com um absorvedor de treino (aberto e fechado).','15–35 min: exposição.','35–50 min: classificar situações de uso e descarte.','50–60 min: mini-prova e avaliação.'],
 blocks:[
 {t:'text',h:'Parar a queda sem machucar',html:`<p>Parar uma pessoa em queda gera uma <strong>força de impacto</strong> no corpo e na ancoragem. Quanto maior o <strong>fator de queda</strong>, maior essa força.</p><p>O <strong>absorvedor de energia</strong> se abre (rasga as costuras internas) durante a retenção e <strong>limita a força transmitida ao corpo</strong> a um valor tolerável, em geral até cerca de <strong>6 kN</strong>, conforme a norma técnica do equipamento. Em troca, ele <strong>aumenta a distância de parada</strong>, e por isso entra no cálculo da ZLQ.</p><div class="note warn">Absorvedor que foi acionado, mesmo parcialmente, <strong>não pode ser reutilizado</strong>. Ele já cumpriu a sua função.</div>`},
 {t:'classify',h:'Uso ou descarte?',buckets:['Pode usar','Retirar de uso'],items:[
  ['Capa do absorvedor rasgada e costuras internas aparentes',1,'Sinal de acionamento ou dano.'],
  ['Etiqueta legível, CA válido e inspeção sem defeitos',0,'Condição normal de uso.'],
  ['Absorvedor que reteve uma queda na semana passada',1,'Após uma queda, sai de uso.'],
  ['Fita com queimadura de solda',1,'Dano térmico compromete a resistência.'],
  ['Talabarte guardado seco, longe do sol, sem defeitos',0,'Armazenamento correto e sem dano.']]},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'O que acontece com a força de impacto quando o fator de queda aumenta?',o:['Diminui','Aumenta','Não muda','Zera'],a:1,why:'Mais queda livre gera mais energia a ser absorvida.'},
  {q:'O absorvedor de energia:',o:['Reduz a distância de queda','Limita a força no corpo, mas aumenta a distância de parada','Dispensa o cálculo da ZLQ','Pode ser reutilizado após a queda'],a:1,why:'Ele troca força por distância. Por isso a extensão dele entra na ZLQ.'}]}
 ]},
{id:'a10',stage:2,day:4,title:'Efeito pêndulo e bordas cortantes',sub:'Dois riscos escondidos na hora de escolher a ancoragem.',
 goals:['Reconhecer o risco de queda pendular','Escolher ancoragem que reduza o pêndulo','Proteger cordas e fitas contra arestas'],
 exam:'Questão 15',
 inst:['0–10 min: demonstração do pêndulo com um peso e um barbante.','10–30 min: exposição.','30–50 min: casos em duplas.','50–60 min: mini-prova e avaliação.'],
 blocks:[
 {t:'text',h:'Efeito pêndulo',html:`<p>Se o trabalhador se afasta lateralmente do ponto de ancoragem e cai, ele <strong>balança como um pêndulo</strong>. Pode bater em paredes, pilares ou equipamentos, e o cabo pode <strong>arrastar sobre a borda</strong>.</p><p>Para reduzir o risco: manter a ancoragem <strong>o mais próximo possível da vertical</strong> acima do trabalhador, reposicionar a ancoragem ao se deslocar, ou usar linha de vida horizontal ao longo do percurso.</p>`},
 {t:'text',h:'Bordas e arestas',html:`<p>Fitas, cordas e cabos podem ser <strong>cortados</strong> ao passar sobre arestas vivas durante a retenção da queda. Em borda de laje, viga metálica ou telha, use <strong>protetor de borda</strong> e equipamentos indicados pelo fabricante para uso sobre bordas.</p><div class="note warn">A borda também conta na ZLQ: a queda sobre uma aresta pode mudar o ponto de giro e a distância percorrida.</div>`},
 {t:'quiz',h:'Qual a melhor decisão?',items:[
  {q:'O trabalhador precisa andar 6 m ao longo da borda de uma laje e só há um ponto de ancoragem no início.',o:['Usar o mesmo ponto e andar com cuidado','Instalar linha de vida horizontal ou reposicionar a ancoragem ao longo do trajeto','Andar sem conexão','Usar talabarte mais longo'],a:1,why:'Afastar-se lateralmente do ponto cria queda pendular.'},
  {q:'A corda do sistema vai passar sobre a quina de uma viga metálica.',o:['Ignorar','Usar protetor de borda e equipamento indicado para borda','Enrolar fita isolante','Usar corda mais fina'],a:1,why:'Aresta viva pode cortar a corda na queda.'},
  {q:'Qual posição de ancoragem reduz o efeito pêndulo?',o:['Bem ao lado do trabalhador','Na vertical, acima do trabalhador','Abaixo dos pés','Atrás de um pilar'],a:1,why:'Na vertical não há balanço lateral.'}]}
 ]},
{id:'a11',stage:2,day:4,title:'Inspeção, guarda e vida útil do EPI',sub:'Rotina de inspeção, registro e critérios de descarte.',
 goals:['Fazer inspeção completa do SPIQ','Registrar a inspeção periódica','Aplicar critérios de descarte'],
 exam:'Questão 16',
 inst:['0–10 min: distribuir kits de EPI (alguns com defeitos plantados).','10–40 min: PRÁTICA: inspeção em duplas com ficha.','40–50 min: discussão dos defeitos encontrados.','50–60 min: mini-prova e avaliação.'],
 blocks:[
 {t:'text',h:'Dois tipos de inspeção',html:`<p><strong>Inspeção antes do uso:</strong> feita pelo próprio trabalhador, todas as vezes. Visual e tátil, em todo o conjunto.</p><p><strong>Inspeção periódica:</strong> feita conforme a periodicidade definida pela empresa e pelo fabricante, por pessoa designada, com <strong>registro</strong>. Equipamentos reprovados são <strong>inutilizados e descartados</strong>, para não voltarem ao uso por engano.</p><p>A <strong>vida útil</strong> e os critérios de descarte vêm do <strong>manual do fabricante</strong>. Calor, produtos químicos, sol, umidade e quedas reduzem essa vida.</p>`},
 {t:'classify',h:'Aprovado ou reprovado na inspeção?',buckets:['Aprovado','Reprovado'],items:[
  ['Fita do cinturão com fios puxados e desgaste nas bordas',1,'Desgaste na fita compromete a resistência.'],
  ['Conector com trava que não fecha sozinha',1,'Trava deve fechar e travar automaticamente.'],
  ['Costuras íntegras, fivelas sem deformação, etiqueta legível',0,'Sem defeitos encontrados.'],
  ['Cinturão com etiqueta ilegível e sem identificação',1,'Sem rastreabilidade, não é usado.'],
  ['Conector com corrosão leve superficial que não sai',1,'Corrosão em conector reprova o equipamento.'],
  ['Talabarte limpo, seco e sem cortes',0,'Condição normal.']]},
 {t:'flash',h:'Cartões de revisão',items:[['Antes do uso','Inspeção pelo trabalhador, sempre.'],['Periódica','Por pessoa designada, com registro.'],['Reprovado','Inutilizar e descartar.'],['Vida útil','Definida pelo manual do fabricante.']]},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'Um cinturão foi reprovado na inspeção periódica. O que fazer?',o:['Guardar como reserva','Inutilizar e descartar','Doar para outro setor','Usar só em treinamento de altura real'],a:1,why:'Inutilizar evita que volte ao uso por engano.'},
  {q:'Onde estão os critérios de vida útil do equipamento?',o:['No manual do fabricante','Na nota fiscal','No crachá do trabalhador','Em nenhum lugar'],a:0,why:'O fabricante define vida útil, inspeção e descarte.'}]}
 ]},
{id:'a12',stage:2,day:4,title:'Andaimes',sub:'Montagem, liberação e uso seguro com a NR-18.',
 goals:['Reconhecer um andaime liberado para uso','Identificar defeitos que impedem o uso','Saber onde se conectar em um andaime'],
 exam:'Questão 17',
 inst:['0–15 min: fotos de andaimes certos e errados.','15–35 min: exposição.','35–50 min: PRÁTICA: inspeção de um andaime do local, com lista de verificação.','50–60 min: mini-prova e avaliação.'],
 blocks:[
 {t:'text',h:'Andaime pronto para uso',html:`<ul><li>Montado por trabalhadores <strong>capacitados</strong>, conforme projeto ou manual do fabricante.</li><li><strong>Base</strong> nivelada e firme, com sapatas; rodízios travados em andaime móvel.</li><li><strong>Estaiamento ou ancoragem</strong> à estrutura conforme o projeto.</li><li><strong>Piso</strong> completo, sem vãos, com pranchas travadas.</li><li><strong>Guarda-corpo e rodapé</strong> em todo o perímetro das plataformas de trabalho.</li><li>Acesso seguro por escada própria. Não se sobe pelos travamentos.</li><li><strong>Liberação</strong> registrada antes do uso, conforme o procedimento da empresa.</li></ul><div class="note warn">Nunca se desloca andaime móvel com trabalhador em cima.</div>`},
 {t:'classify',h:'Pode subir?',buckets:['Pode subir','Não pode subir'],items:[
  ['Plataforma com uma prancha faltando',1,'Vão no piso é risco de queda.'],
  ['Andaime móvel com rodízios destravados',1,'O andaime pode se deslocar.'],
  ['Andaime liberado, com guarda-corpo, rodapé e piso completo',0,'Atende às condições de uso.'],
  ['Base apoiada em tijolos soltos',1,'Base precisa ser firme e nivelada, com sapatas.'],
  ['Acesso pela escada interna do andaime',0,'Acesso correto.'],
  ['Último nível sem guarda-corpo',1,'Sem proteção coletiva completa, não se usa.']]},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'É permitido deslocar um andaime móvel com o trabalhador em cima?',o:['Sim, devagar','Não','Sim, se ele estiver conectado','Sim, se for menos de 2 m'],a:1,why:'Desloca-se o andaime sempre sem ninguém em cima.'},
  {q:'O acesso à plataforma do andaime deve ser feito:',o:['Pelos travamentos diagonais','Por escada própria ou acesso previsto','Pela janela do prédio','Escalando a estrutura por fora'],a:1,why:'Travamentos não são escada.'}]}
 ]},
{id:'a13',stage:2,day:4,title:'Plataformas elevatórias e cestos',sub:'PEMT, cesto aéreo e onde conectar o cinturão.',
 goals:['Reconhecer os riscos da plataforma elevatória','Conectar-se no ponto correto do cesto','Fazer a verificação antes da operação'],
 exam:'Questão 18',
 inst:['0–10 min: vídeo ou foto de uma PEMT e do ponto de ancoragem do cesto.','10–30 min: exposição.','30–50 min: verificação pré-uso com lista do fabricante (se houver equipamento).','50–60 min: mini-prova e avaliação.'],
 blocks:[
 {t:'text',h:'Plataforma não é desculpa para ficar sem conexão',html:`<p>Na <strong>Plataforma Elevatória Móvel de Trabalho (PEMT)</strong> e no cesto aéreo, o trabalhador deve estar conectado ao <strong>ponto de ancoragem indicado pelo fabricante no cesto</strong>, com talabarte de comprimento adequado, de preferência <strong>curto, para restrição de movimento</strong> (impedir que o corpo saia do cesto).</p><ul><li>Operação só por <strong>operador capacitado</strong> e autorizado.</li><li>Verificação pré-operacional conforme o fabricante (comandos, emergência, nivelamento, pneus, alarmes).</li><li>Terreno firme e nivelado; respeitar a carga máxima e o limite de vento do fabricante.</li><li>Distância segura de redes elétricas.</li><li>Nunca sair do cesto em altura para uma estrutura, nem subir no guarda-corpo do cesto.</li></ul>`},
 {t:'quiz',h:'Qual a decisão certa?',items:[
  {q:'Onde o trabalhador conecta o talabarte dentro do cesto?',o:['No guarda-corpo do cesto','No ponto de ancoragem indicado pelo fabricante','Na estrutura do prédio ao lado','Não precisa conectar'],a:1,why:'O ponto do fabricante é projetado para isso.'},
  {q:'Para alcançar um ponto mais alto, o trabalhador pensa em subir no guarda-corpo do cesto.',o:['Pode, se estiver conectado','Não pode','Pode, se for rápido','Pode, se outro segurar'],a:1,why:'Subir no guarda-corpo anula a proteção do cesto. Reposicione a plataforma.'},
  {q:'O vento está acima do limite do manual da PEMT.',o:['Operar devagar','Não operar','Operar com dois trabalhadores','Operar só até meia altura'],a:1,why:'Limite do fabricante é condição impeditiva.'},
  {q:'Qual tipo de talabarte é preferível no cesto?',o:['Talabarte longo com absorvedor','Talabarte curto que impeça o corpo de sair do cesto','Corda comum','Nenhum'],a:1,why:'Restrição de movimento: o trabalhador nem chega a cair.'}]}
 ]},
{id:'a14',stage:2,day:4,title:'Telhados e coberturas',sub:'Telhas frágeis, claraboias, passarelas e linhas de vida.',
 goals:['Reconhecer coberturas que não suportam peso','Planejar caminho seguro sobre o telhado','Escolher a proteção certa para cada cobertura'],
 exam:'Questão 19',
 inst:['0–15 min: casos reais de queda através de telha.','15–35 min: exposição.','35–50 min: planejamento em grupo: desenhar o caminho seguro em uma planta de telhado.','50–60 min: mini-prova e avaliação.'],
 blocks:[
 {t:'text',h:'O perigo está embaixo dos pés',html:`<p>Muitos acidentes graves em telhado acontecem <strong>através da cobertura</strong>, e não pela borda. Telhas de fibrocimento, translúcidas e claraboias <strong>não suportam o peso de uma pessoa</strong>.</p><ul><li>Nunca pise diretamente em telha frágil: use <strong>passarelas ou tábuas</strong> apoiadas na estrutura.</li><li>Proteja ou sinalize <strong>claraboias e aberturas</strong>.</li><li>Use <strong>linha de vida</strong> ou ancoragens previstas na AR; considere a ZLQ, inclusive para queda através da telha.</li><li>Não trabalhe em telhado com chuva, vento forte ou superfície escorregadia.</li><li>Isole a área abaixo contra queda de materiais.</li></ul>`},
 {t:'classify',h:'Seguro ou inseguro?',buckets:['Seguro','Inseguro'],items:[
  ['Andar sobre telha de fibrocimento entre as terças',1,'A telha pode quebrar entre os apoios.'],
  ['Usar passarela apoiada na estrutura, conectado à linha de vida',0,'Caminho e proteção corretos.'],
  ['Pisar em telha translúcida para cortar caminho',1,'Telha translúcida é frágil.'],
  ['Claraboia protegida com tela e sinalizada',0,'Abertura protegida.'],
  ['Trabalhar no telhado molhado logo após a chuva',1,'Superfície escorregadia é condição impeditiva.']]},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'Qual a causa frequente de queda em telhados?',o:['Somente a borda','Ruptura da telha ou claraboia sob o trabalhador','Excesso de EPI','Sinalização demais'],a:1,why:'A queda através da cobertura é muito comum.'},
  {q:'Como se caminha sobre telhado de telha frágil?',o:['Pisando nas ondas mais altas','Por passarelas apoiadas na estrutura','Descalço','Rapidamente'],a:1,why:'Passarelas distribuem o peso na estrutura.'}]}
 ]},
{id:'a15',stage:2,day:5,title:'Postes, torres e risco elétrico',sub:'Escalada, posicionamento e a combinação com a NR-10.',
 goals:['Planejar a subida em poste ou torre','Combinar posicionamento com retenção de queda','Controlar o risco elétrico antes de subir'],
 exam:'Questão 20',
 inst:['0–15 min: tipos de estrutura da empresa (poste, torre autoportante, estaiada).','15–35 min: exposição.','35–50 min: PRÁTICA: ajuste do talabarte de posicionamento em poste-escola, se houver.','50–60 min: mini-prova e avaliação.'],
 blocks:[
 {t:'text',h:'Posicionamento não é retenção',html:`<p>O <strong>talabarte de posicionamento</strong> (nas argolas laterais) deixa as mãos livres, mas <strong>não foi feito para reter queda</strong>. Em poste e torre, ele é usado <strong>junto</strong> com um sistema de retenção de queda (trava-quedas em linha vertical, talabarte com absorvedor na argola dorsal ou dispositivo indicado pelo fabricante).</p><p>Na torre, a subida é feita pela <strong>escada com linha de vida vertical</strong> e trava-quedas guiado, mantendo conexão durante todo o percurso.</p>`},
 {t:'text',h:'Risco elétrico antes de tudo',html:`<p>Com rede elétrica próxima, o trabalho só começa com o <strong>risco elétrico controlado conforme a NR-10</strong>: desenergização quando possível, distâncias de segurança, trabalhadores autorizados para serviços em eletricidade e ferramentas e EPIs adequados.</p><div class="note warn">Escada metálica, corda molhada e cabos de aço conduzem eletricidade. A AR deve tratar o choque elétrico e a queda causada por ele.</div>`},
 {t:'order',h:'Ordene a subida em poste',steps:['Ler a AR e conferir a PT','Verificar rede elétrica e condições do poste (base, trincas)','Isolar e sinalizar a área','Inspecionar EPI e ferramentas','Subir com sistema de retenção de queda conectado','Posicionar-se com o talabarte de posicionamento, mantendo a retenção']},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'O talabarte de posicionamento sozinho protege contra queda?',o:['Sim','Não, precisa de sistema de retenção junto','Só em poste de madeira','Só abaixo de 5 m'],a:1,why:'Posicionamento e retenção são funções diferentes.'},
  {q:'Antes de subir em poste com rede próxima, o primeiro controle é:',o:['Usar luva de raspa','Controlar o risco elétrico conforme a NR-10','Subir rápido','Avisar o colega'],a:1,why:'Choque pode causar a queda. O risco elétrico vem antes.'}]}
 ]},
{id:'a16',stage:2,day:5,title:'Acesso por cordas',sub:'Anexo I da NR-35: quando usar, equipe e sistema duplo.',
 goals:['Reconhecer quando o acesso por cordas é adequado','Explicar o sistema de duas cordas independentes','Saber os requisitos de equipe e certificação'],
 exam:'Questão 21',
 inst:['0–15 min: vídeo de acesso por cordas em fachada.','15–40 min: exposição do Anexo I.','40–50 min: casos de decisão.','50–60 min: mini-prova e avaliação.','Esta aula não habilita para acesso por cordas: a certificação é específica.'],
 blocks:[
 {t:'text',h:'Técnica especializada',html:`<p>O <strong>acesso por cordas</strong> é usado para chegar e trabalhar em locais elevados com cordas, como fachadas e estruturas onde outros meios são inviáveis. Ele é tratado no <strong>Anexo I da NR-35</strong>.</p><ul><li>Os trabalhadores devem ser <strong>certificados</strong> conforme norma técnica específica (no Brasil, ABNT NBR 15475).</li><li>O trabalho é feito em <strong>equipe</strong>, com supervisão de profissional qualificado em acesso por cordas.</li><li>Cada trabalhador usa <strong>duas cordas</strong>: a <strong>de trabalho</strong> e a <strong>de segurança</strong>, com <strong>ancoragens independentes</strong>.</li><li>Deve haver <strong>plano de resgate</strong> com a equipe capaz de executá-lo no local.</li><li>Condições climáticas (vento, chuva, raios) são avaliadas e podem impedir o trabalho.</li></ul><div class="note warn">Este módulo é informativo. A capacitação em NR-35 <strong>não habilita</strong> ninguém para acesso por cordas.</div>`},
 {t:'flash',h:'Cartões de revisão',items:[['Anexo I','Acesso por cordas.'],['Duas cordas','Trabalho e segurança, com ancoragens independentes.'],['Certificação','Específica, conforme norma técnica (ABNT NBR 15475).'],['Resgate','Plano e equipe prontos no local.']]},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'No acesso por cordas, cada trabalhador usa:',o:['Uma corda só','Duas cordas com ancoragens independentes','Duas cordas na mesma ancoragem','Corda e escada'],a:1,why:'Corda de trabalho e corda de segurança, independentes.'},
  {q:'Um trabalhador com capacitação NR-35 de 8 h pode fazer acesso por cordas?',o:['Sim','Não, precisa de certificação específica','Sim, se for supervisor','Sim, se tiver experiência em escada'],a:1,why:'Acesso por cordas exige certificação própria.'}]}
 ]},
{id:'a17',stage:2,day:5,title:'Escadas',sub:'Escada de mão, extensível e marinheiro: inclinação, fixação e uso.',
 goals:['Posicionar corretamente uma escada de mão','Reconhecer defeitos que impedem o uso','Usar escada tipo marinheiro com proteção contra queda'],
 exam:'Questão 22',
 inst:['0–10 min: mostrar escadas da empresa.','10–25 min: exposição.','25–50 min: PRÁTICA: posicionar a escada na inclinação 1:4 e fazer a inspeção.','50–60 min: mini-prova e avaliação.'],
 blocks:[
 {t:'text',h:'Escada de mão bem posicionada',html:`<ul><li><strong>Inclinação 1 para 4:</strong> a base fica afastada da parede cerca de 1/4 da altura do apoio. Ex.: apoio a 4 m, base a 1 m da parede.</li><li>Deve <strong>ultrapassar em cerca de 1 m</strong> o nível de desembarque, para servir de apoio na transição.</li><li>Apoiada em piso firme, com <strong>sapatas antiderrapantes</strong>, e <strong>amarrada ou fixada</strong> no topo ou segurada na base.</li><li>Subir e descer <strong>de frente para a escada</strong>, com <strong>três pontos de contato</strong> (duas mãos e um pé, ou dois pés e uma mão).</li><li>Ferramentas em bolsa ou içadas por corda, nunca na mão durante a subida.</li><li>Escada de mão é para <strong>acesso</strong> e serviços leves e rápidos. Trabalho prolongado pede plataforma ou andaime.</li></ul>`},
 {t:'classify',h:'Pode usar a escada?',buckets:['Pode usar','Não pode'],items:[
  ['Degrau trincado',1,'Defeito estrutural reprova a escada.'],
  ['Escada com sapatas antiderrapantes, sem defeitos, amarrada no topo',0,'Condição correta.'],
  ['Escada metálica perto de rede elétrica energizada',1,'Risco de choque: use escada isolante e controle o risco conforme a NR-10.'],
  ['Escada emendada com arame para ficar mais alta',1,'Emenda improvisada é proibida.'],
  ['Escada apoiada sobre caixas para alcançar mais alto',1,'Base deve ser firme e nivelada.']]},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'Escada apoiada a 4 m de altura. A base deve ficar a cerca de quanto da parede?',o:['0,5 m','1 m','2 m','3 m'],a:1,why:'Inclinação 1:4: 4 ÷ 4 = 1 m.'},
  {q:'Quantos pontos de contato manter ao subir?',o:['1','2','3','4'],a:2,why:'Duas mãos e um pé, ou dois pés e uma mão.'}]}
 ]},
{id:'a18',stage:2,day:5,title:'Fatores humanos e condições impeditivas',sub:'Fadiga, pressa, excesso de confiança e quando dizer "pare".',
 goals:['Reconhecer fatores humanos que causam acidentes','Aplicar o direito de recusa diante de risco grave e iminente','Fazer uma boa comunicação de segurança antes de subir'],
 exam:'Questão 23',
 inst:['0–15 min: depoimento ou caso real sobre pressa e excesso de confiança.','15–35 min: exposição.','35–50 min: simulação de diálogo de segurança antes da tarefa.','50–60 min: mini-prova e avaliação.'],
 blocks:[
 {t:'cards',h:'Armadilhas do dia a dia',items:[['Pressa e prazo','Pular etapas "só desta vez" é a origem de muitos acidentes.'],['Excesso de confiança','Anos de experiência não substituem a conexão e a inspeção.'],['Fadiga e mal-estar','Sono ruim, remédios, álcool, tontura e calor reduzem a atenção e o equilíbrio.'],['Comunicação falha','Equipe sem combinar sinais e sem saber o plano de resgate.']]},
 {t:'text',h:'O direito de parar',html:`<p>Diante de <strong>risco grave e iminente</strong>, o trabalhador deve <strong>interromper</strong> a atividade e <strong>comunicar</strong> o superior. A NR-1 garante ao trabalhador o <strong>direito de recusa</strong> nessas situações, e o empregador deve assegurar a suspensão do trabalho.</p><div class="note">Antes de subir, faça a pergunta em equipe: <strong>"O que pode dar errado aqui e o que faremos se acontecer?"</strong></div>`},
 {t:'classify',h:'Para ou continua?',buckets:['Pode continuar','Interromper'],items:[
  ['Trovões se aproximando',1,'Descarga atmosférica é condição impeditiva.'],
  ['Colega relata tontura depois do almoço',1,'Mal-estar impede o trabalho em altura.'],
  ['Encerramento da PT, com tudo em ordem',0,'Fim normal da atividade.'],
  ['A iluminação caiu e já está escurecendo',1,'Iluminação insuficiente impede o trabalho.'],
  ['Encarregado pede para soltar a conexão para ganhar tempo',1,'Ninguém pode exigir trabalho sem proteção.']]},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'O encarregado manda voltar ao trabalho mesmo com risco grave e iminente. O trabalhador:',o:['Deve obedecer','Pode exercer o direito de recusa e comunicar','Deve ir embora sem avisar','Deve chamar a polícia'],a:1,why:'O direito de recusa protege o trabalhador em risco grave e iminente.'},
  {q:'Qual destes é fator humano de risco?',o:['Linha de vida certificada','Fadiga por noite mal dormida','Guarda-corpo','Placa de ancoragem'],a:1,why:'Fadiga reduz atenção e equilíbrio.'}]}
 ]},
{id:'a19',stage:2,day:5,title:'Resgate avançado',sub:'Plano de resgate, tempo de resposta e cuidados com a vítima suspensa.',
 goals:['Montar um plano de resgate para uma atividade','Entender por que o tempo é crítico','Saber os cuidados com a vítima após a suspensão'],
 exam:'Questão 24',
 inst:['0–10 min: relembrar a síndrome da suspensão.','10–30 min: exposição do plano de resgate.','30–55 min: PRÁTICA: simulado de resgate cronometrado com boneco.','55–60 min: avaliação.','Técnicas de resgate e primeiros socorros seguem o instrutor habilitado e o plano da empresa.'],
 blocks:[
 {t:'text',h:'Um plano antes da subida',html:`<p>O <strong>plano de resgate</strong> faz parte do planejamento e precisa existir <strong>antes</strong> do início da atividade. Ele responde:</p><ul><li><strong>Quem</strong> faz o resgate e se a equipe é própria ou externa, treinada e disponível no horário.</li><li><strong>Como</strong>: técnica e equipamentos (kit de resgate, tripé, descensor), já no local.</li><li><strong>Em quanto tempo</strong> a vítima é alcançada. Ficar suspenso e imóvel no cinturão pode levar à <strong>síndrome da suspensão</strong> em poucos minutos.</li><li><strong>Comunicação</strong>: como acionar a equipe, SAMU (192) e Bombeiros (193), com endereço e acesso definidos.</li></ul><div class="note warn">Contar só com o Corpo de Bombeiros não é plano de resgate quando o tempo de chegada deles é maior que o tempo seguro de suspensão.</div>`},
 {t:'order',h:'Ordene a resposta a uma queda retida',steps:['Dar o alarme e acionar a equipe de resgate','Garantir a segurança do local e de quem vai resgatar','Executar o resgate conforme o plano','Descer a vítima ao solo','Prestar os primeiros socorros conforme o protocolo','Encaminhar a avaliação médica, mesmo sem sintomas','Retirar de uso o equipamento envolvido e registrar a ocorrência']},
 {t:'quiz',h:'Mini-quiz',items:[
  {q:'Qual o maior inimigo no resgate de vítima suspensa?',o:['O custo','O tempo','A papelada','O uniforme'],a:1,why:'A síndrome da suspensão pode surgir em poucos minutos.'},
  {q:'Depois de uma queda retida pelo sistema, o equipamento usado deve:',o:['Voltar ao estoque','Ser retirado de uso e avaliado','Ser lavado e reutilizado','Ser doado'],a:1,why:'O equipamento que reteve queda sai de uso.'},
  {q:'O plano de resgate deve estar pronto:',o:['Depois do acidente','Antes de iniciar a atividade','Só em atividades acima de 10 m','Só se houver PT'],a:1,why:'Resgate é parte do planejamento de toda atividade.'}]}
 ]},
{id:'a20',stage:2,day:5,title:'Estudos de caso e avaliação avançada',sub:'Análise de acidentes reais e a prova da etapa 2.',
 goals:['Analisar causas de acidentes de trabalho em altura','Propor medidas que teriam evitado cada acidente','Responder a avaliação final avançada'],
 exam:'Todas',
 inst:['0–20 min: estudos de caso em grupos.','20–50 min: aplicação da avaliação avançada.','50–60 min: correção comentada.','Critério de aprovação sugerido: 70%.'],
 blocks:[
 {t:'text',h:'Caso 1: a telha que quebrou',html:`<p>Um trabalhador subiu ao telhado de um galpão para trocar uma telha. Andou sobre as telhas de fibrocimento, sem passarela e sem linha de vida, porque "era rápido". Uma telha quebrou e ele caiu 6 m.</p><p><strong>Falhas:</strong> sem Análise de Risco, sem PT, sem passarela, sem ancoragem, pressa.</p>`},
 {t:'text',h:'Caso 2: conectado no lugar errado',html:`<p>Em uma plataforma elevatória, o trabalhador prendeu o talabarte na viga do prédio ao lado para alcançar um ponto. A plataforma desceu por comando de outro operador e ele ficou suspenso, preso à viga, até o resgate.</p><p><strong>Falhas:</strong> conexão fora do ponto do cesto, saída da plataforma em altura, comunicação falha entre operadores e plano de resgate sem tempo de resposta definido.</p>`},
 {t:'text',h:'Caso 3: espaço livre insuficiente',html:`<p>Um trabalhador ancorou o talabarte com absorvedor na altura dos pés, em uma estrutura a 4 m do solo. Ao cair, o sistema funcionou, mas ele tocou o solo antes de ser totalmente freado.</p><p><strong>Falhas:</strong> ancoragem abaixo da argola (fator de queda 2) e ZLQ não calculada. Com talabarte de 1,5 m e absorvedor de 1,75 m, seriam necessários cerca de 5,75 m.</p>`},
 {t:'classify',h:'Que medida teria evitado?',buckets:['Caso 1 (telha)','Caso 2 (cesto)','Caso 3 (ZLQ)'],items:[
  ['Passarela apoiada na estrutura e linha de vida',0,'Distribui o peso e protege contra queda através da telha.'],
  ['Conectar no ponto de ancoragem do cesto e não sair da plataforma',1,'O cesto tem ponto próprio de ancoragem.'],
  ['Ancoragem acima da cabeça ou trava-quedas retrátil',2,'Reduz a queda livre e a ZLQ necessária.'],
  ['Calcular a ZLQ na Análise de Risco',2,'O cálculo mostraria que 4 m não bastavam.'],
  ['Comunicação clara entre operadores da plataforma',1,'Evita movimento inesperado do cesto.']]}
 ]}
);

function bZLQ(b,mod,bi){const w=h('div',{class:'block'},h('h3',{},'Calculadora de zona livre de queda'),

async function afterLogin(){const uid=SESSION.user.id;UID=uid;ME=null;
 let adm=false;try{const r=await SB.from('admins').select('user_id').eq('user_id',uid).maybeSingle();adm=!!r.data}catch(e){}
 ISOWNER=adm;$('#outBtn').hidden=false;
 if(adm){$('#instBtn').hidden=false;return showPanel()}
 MYREF=makeRef(uid);let snap=null;
 try{snap=await MYREF.get()}catch(e){return renderBloqueio('Não foi possível carregar o seu registro. Confira a internet e recarregue a página.')}
 if(!snap.exists){return renderRegistro()}
 loadAluno(snap.data());MODE='aluno';setSync('Progresso sincronizado');
 const hsh=(location.hash||'#home').slice(1);render(M.find(x=>x.id===hsh)||hsh==='resumo'||hsh==='home'?hsh:'home')}
async function sair(){try{await push();await flushResp()}catch(e){}
 try{await SB.auth.signOut()}catch(e){}
 SESSION=null;UID=null;MYREF=null;ME=null;ISOWNER=false;S=newState();ALUNOS=[];LOADED=false;SEL=null;RESP={};$('#instBtn').hidden=true;$('#panelBtn').hidden=true;try{history.replaceState(null,'','#')}catch(e){}renderLogin('entrar')}
async function boot(){$('#main').append(h('p',{},'Carregando...'));
 const cfg=window.APP_CONFIG;
 if(!window.supabase||!cfg||!cfg.SUPABASE_URL||/SEU-PROJETO|COLE_AQUI/i.test(cfg.SUPABASE_URL)){return renderBloqueio('Configuração pendente: preencha o arquivo config.js com a URL e a chave do Supabase, como descrito no LEIA-ME.')}
 SB=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
 SB.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){RECOVERY=true;if(MODE!=='boot')setTimeout(renderNovaSenha,0)}});
 let sess=null;try{const r=await SB.auth.getSession();sess=r.data.session}catch(e){}
 SESSION=sess;
 if(RECOVERY&&sess)return renderNovaSenha();
 if(!sess)return renderLogin('entrar');
 await afterLogin()}
$('#instBtn').addEventListener('click',()=>{S.inst=!S.inst;save();render((location.hash||'#home').slice(1))});
$('#panelBtn').addEventListener('click',()=>go('panel'));
$('#outBtn').addEventListener('click',sair);
boot();
